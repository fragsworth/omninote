<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16181d" />
    <meta
      name="description"
      content="Notepad - a fast, offline, single-file plain-text notepad for the browser."
    />
    <title>Notepad</title>
    <style>
      /* ---------------------------------------------------------------
         Design tokens. Light is the base palette; dark is a token swap
         so every rule below is written once.
         --------------------------------------------------------------- */
      :root {
        --bg: #f6f4ef;
        --bg-elev: #fffdf8;
        --bg-sunken: #ece8df;
        --fg: #1d1b17;
        --fg-muted: #5e594f;
        --fg-subtle: #8b857a;
        --border: #ded8cb;
        --border-strong: #c7bfae;
        --accent: #9a5b1f;
        --accent-soft: #f2e3d0;
        --accent-fg: #ffffff;
        --danger: #a8321f;
        --danger-soft: #f7e0db;
        --focus: #2f6fb5;
        --shadow: 0 8px 24px rgb(29 27 23 / 12%);
        --radius: 8px;
        --radius-sm: 5px;
        --sidebar-w: 272px;
        --editor-font: ui-serif, Georgia, "Iowan Old Style", "Times New Roman",
          serif;
        --editor-size: 17px;
        --editor-leading: 1.65;
        --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        --mono-font: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #16181d;
          --bg-elev: #1e2127;
          --bg-sunken: #101216;
          --fg: #e9e6df;
          --fg-muted: #a6a29a;
          --fg-subtle: #7d7a73;
          --border: #2e323a;
          --border-strong: #454b55;
          --accent: #e0a86a;
          --accent-soft: #33291c;
          --accent-fg: #1a1206;
          --danger: #e8806c;
          --danger-soft: #3a211c;
          --focus: #79b0f0;
          --shadow: 0 8px 24px rgb(0 0 0 / 45%);
          color-scheme: dark;
        }
      }

      :root[data-theme="dark"] {
        --bg: #16181d;
        --bg-elev: #1e2127;
        --bg-sunken: #101216;
        --fg: #e9e6df;
        --fg-muted: #a6a29a;
        --fg-subtle: #7d7a73;
        --border: #2e323a;
        --border-strong: #454b55;
        --accent: #e0a86a;
        --accent-soft: #33291c;
        --accent-fg: #1a1206;
        --danger: #e8806c;
        --danger-soft: #3a211c;
        --focus: #79b0f0;
        --shadow: 0 8px 24px rgb(0 0 0 / 45%);
        color-scheme: dark;
      }

      /* Editor typeface, driven by the font setting. */
      :root[data-font="sans"] {
        --editor-font: var(--ui-font);
      }
      :root[data-font="mono"] {
        --editor-font: var(--mono-font);
      }

      * {
        box-sizing: border-box;
      }

      /* A class with `display: flex` outranks the browser's own
         `[hidden] { display: none }`, so say it louder: every panel in this
         file is shown and hidden through the hidden attribute. */
      [hidden] {
        display: none !important;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 var(--ui-font);
        -webkit-text-size-adjust: 100%;
        overflow: hidden;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 40;
        padding: 10px 14px;
        background: var(--bg-elev);
        border: 1px solid var(--border-strong);
        border-radius: 0 0 var(--radius) 0;
      }
      .skip-link:focus {
        left: 0;
      }

      /* ---------------------------------------------------------------
         Shell
         --------------------------------------------------------------- */
      .app {
        display: grid;
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
        height: 100dvh;
        height: 100vh;
      }

      :root[data-sidebar="collapsed"] .app {
        grid-template-columns: 0 minmax(0, 1fr);
      }

      /* A hidden list must be hidden from the keyboard too: a zero-width
         column still holds focusable controls, visibility: hidden does not. */
      :root[data-sidebar="collapsed"] .sidebar {
        visibility: hidden;
      }

      /* ---------------------------------------------------------------
         Sidebar
         --------------------------------------------------------------- */
      .sidebar {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--bg-sunken);
        border-right: 1px solid var(--border);
        overflow: hidden;
      }

      .sidebar__head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 12px 8px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 650;
        letter-spacing: 0.01em;
        margin-right: auto;
      }
      .brand svg {
        display: block;
        color: var(--accent);
      }

      .sidebar__tools {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0 12px 10px;
      }

      .field {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0 8px;
      }
      .field:focus-within {
        border-color: var(--border-strong);
      }
      .field svg {
        flex: none;
        color: var(--fg-subtle);
      }
      .field input,
      .field select {
        flex: 1 1 auto;
        min-width: 0;
        border: 0;
        background: none;
        padding: 7px 0;
        outline: none;
      }
      .field input::-webkit-search-cancel-button {
        filter: grayscale(1);
      }

      .sort-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--fg-muted);
      }
      .sort-row select {
        flex: 1 1 auto;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 5px 6px;
      }

      .note-list {
        list-style: none;
        margin: 0;
        padding: 4px 8px 12px;
        overflow-y: auto;
        flex: 1 1 auto;
        scrollbar-width: thin;
      }

      .note-item {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        padding: 8px 9px;
        cursor: pointer;
        margin-bottom: 2px;
      }
      .note-item:hover {
        background: var(--bg-elev);
      }
      .note-item[aria-selected="true"] {
        background: var(--bg-elev);
        border-color: var(--border-strong);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .note-item__title {
        display: flex;
        align-items: baseline;
        gap: 5px;
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .note-item__pin {
        color: var(--accent);
        flex: none;
        font-size: 11px;
      }
      .note-item__meta {
        display: flex;
        gap: 6px;
        font-size: 11.5px;
        color: var(--fg-subtle);
        margin-top: 2px;
      }
      .note-item__snippet {
        font-size: 12px;
        color: var(--fg-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 1px;
      }
      .note-item mark {
        background: var(--accent-soft);
        color: inherit;
        border-radius: 2px;
      }

      .empty-note {
        color: var(--fg-subtle);
        font-size: 12.5px;
        padding: 10px 9px;
      }

      .sidebar__foot {
        border-top: 1px solid var(--border);
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sidebar__foot .row {
        display: flex;
        gap: 6px;
      }

      /* ---------------------------------------------------------------
         Buttons
         --------------------------------------------------------------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        background: var(--bg-elev);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 6px 9px;
        font-size: 12.5px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        border-color: var(--fg-subtle);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .btn--primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
        font-weight: 600;
      }
      .btn--ghost {
        background: none;
        border-color: transparent;
      }
      .btn--ghost:hover:not(:disabled) {
        background: var(--bg-sunken);
        border-color: var(--border);
      }
      .btn--grow {
        flex: 1 1 auto;
      }
      .btn--danger:hover:not(:disabled) {
        background: var(--danger-soft);
        border-color: var(--danger);
        color: var(--danger);
      }
      .btn[aria-pressed="true"] {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .btn--icon {
        padding: 6px;
        min-width: 30px;
      }

      /* ---------------------------------------------------------------
         Main column
         --------------------------------------------------------------- */
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--bg);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }

      .title-input {
        flex: 1 1 auto;
        min-width: 60px;
        border: 1px solid transparent;
        background: none;
        border-radius: var(--radius-sm);
        padding: 6px 8px;
        font-size: 15px;
        font-weight: 650;
      }
      .title-input:hover {
        border-color: var(--border);
      }
      .title-input:focus {
        border-color: var(--border-strong);
        background: var(--bg-elev);
        outline: none;
      }
      .title-input::placeholder {
        color: var(--fg-subtle);
        font-weight: 500;
      }

      .toolbar__actions {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: none;
      }

      /* Find bar */
      .findbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-sunken);
      }
      .findbar .field {
        flex: 1 1 170px;
        min-width: 120px;
      }
      .findbar__count {
        font-size: 12px;
        color: var(--fg-muted);
        min-width: 74px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .findbar__opts {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--fg-muted);
      }
      .findbar label.check {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        white-space: nowrap;
      }
      .findbar input[type="checkbox"] {
        accent-color: var(--accent);
      }
      .findbar.is-invalid .field:first-child {
        border-color: var(--danger);
      }

      /* Editor */
      .editor-wrap {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
      }

      #editor {
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        resize: none;
        border: 0;
        outline: none;
        background: var(--bg);
        padding: 22px clamp(14px, 5vw, 64px) 40px;
        font-family: var(--editor-font);
        font-size: var(--editor-size);
        line-height: var(--editor-leading);
        tab-size: 4;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        caret-color: var(--accent);
        scrollbar-width: thin;
      }
      :root[data-wrap="off"] #editor {
        white-space: pre;
        overflow-wrap: normal;
        overflow-x: auto;
      }
      #editor::selection {
        background: var(--accent-soft);
        color: var(--fg);
      }

      /* Status bar */
      .statusbar {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        padding: 6px 14px;
        border-top: 1px solid var(--border);
        background: var(--bg-sunken);
        color: var(--fg-muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .statusbar .spacer {
        margin-left: auto;
      }
      .statusbar output {
        white-space: nowrap;
      }
      #save-state[data-state="saving"] {
        color: var(--fg-subtle);
      }
      #save-state[data-state="error"] {
        color: var(--danger);
      }

      /* ---------------------------------------------------------------
         Popover + modal + toast
         --------------------------------------------------------------- */
      .popover {
        position: absolute;
        z-index: 30;
        right: 12px;
        top: 48px;
        width: 250px;
        background: var(--bg-elev);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 12px;
      }
      .popover h2 {
        margin: 0 0 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--fg-subtle);
      }
      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 9px;
      }
      .setting:last-child {
        margin-bottom: 0;
      }
      .setting > span {
        font-size: 12.5px;
      }
      .setting select,
      .setting input[type="number"] {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 4px 6px;
        max-width: 118px;
      }
      .segmented {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: hidden;
      }
      .segmented button {
        background: var(--bg);
        border: 0;
        padding: 4px 8px;
        font-size: 12px;
        cursor: pointer;
      }
      .segmented button[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--fg);
        font-weight: 600;
      }

      .popover--foot {
        right: auto;
        top: auto;
        left: 10px;
        bottom: 38px;
        width: auto;
      }
      .popover--foot .setting {
        margin: 0;
      }
      .popover--foot input {
        width: 88px;
      }

      .statusbar__jump {
        background: none;
        border: 1px solid transparent;
        border-radius: 4px;
        padding: 1px 5px;
        margin: -1px -3px;
        color: inherit;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      .statusbar__jump:hover {
        border-color: var(--border-strong);
      }

      .backdrop {
        position: fixed;
        inset: 0;
        background: rgb(0 0 0 / 38%);
        z-index: 35;
      }

      .modal {
        position: fixed;
        z-index: 36;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(560px, calc(100vw - 32px));
        max-height: min(80vh, 640px);
        overflow: auto;
        background: var(--bg-elev);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px 20px 20px;
      }
      .modal h2 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .modal p.hint {
        margin: 0 0 14px;
        color: var(--fg-muted);
        font-size: 12.5px;
      }
      .modal__close {
        position: absolute;
        top: 10px;
        right: 10px;
      }
      .shortcuts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(232px, 1fr));
        gap: 2px 22px;
        margin: 0;
      }
      .shortcuts div {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 4px 0;
        border-bottom: 1px dashed var(--border);
        font-size: 12.5px;
      }
      .shortcuts dt {
        flex: 1 1 auto;
        color: var(--fg-muted);
      }
      .shortcuts dd {
        margin: 0;
        flex: none;
      }
      kbd {
        font: 600 11px/1.5 var(--mono-font);
        background: var(--bg-sunken);
        border: 1px solid var(--border-strong);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 5px;
        white-space: nowrap;
      }

      .toast {
        position: fixed;
        z-index: 40;
        left: 50%;
        bottom: 46px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: calc(100vw - 24px);
        background: var(--bg-elev);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 9px 10px 9px 14px;
        font-size: 13px;
      }

      .banner {
        padding: 8px 14px;
        background: var(--danger-soft);
        color: var(--danger);
        font-size: 12.5px;
        border-bottom: 1px solid var(--danger);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* The scrim only exists behind the drawer on narrow screens. */
      .sidebar-scrim {
        display: none;
      }

      /* ---------------------------------------------------------------
         Narrow screens: the sidebar becomes an overlay drawer.
         --------------------------------------------------------------- */
      @media (max-width: 720px) {
        /* One column, whatever the sidebar state says: down here the list is
           an overlay drawer, not a column, so it must not reserve any track.
           The second selector matches the desktop collapse rule's specificity
           so this wins. */
        .app,
        :root[data-sidebar="collapsed"] .app {
          grid-template-columns: minmax(0, 1fr);
        }
        .sidebar {
          position: fixed;
          z-index: 25;
          inset: 0 auto 0 0;
          width: min(300px, 86vw);
          box-shadow: var(--shadow);
          transform: translateX(-101%);
          transition: transform 0.18s ease, visibility 0.18s;
        }
        :root[data-sidebar="expanded"] .sidebar {
          transform: none;
        }
        :root[data-sidebar="expanded"] .sidebar-scrim {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 24;
          background: rgb(0 0 0 / 30%);
        }
        /* Nine buttons do not fit beside a title on a phone: give them their
           own row, and let that row scroll rather than the page. */
        .toolbar {
          flex-wrap: wrap;
        }
        .toolbar__actions {
          flex: 1 1 100%;
          overflow-x: auto;
          scrollbar-width: thin;
        }
        #editor {
          padding: 16px 16px 32px;
        }
        .statusbar {
          gap: 10px;
        }
      }

      /* Printing a note should produce the note, not the application. */
      @media print {
        .sidebar,
        .toolbar,
        .findbar,
        .statusbar,
        .toast,
        .popover,
        .modal,
        .backdrop,
        .banner,
        .skip-link {
          display: none !important;
        }
        body,
        #editor {
          background: #fff;
          color: #000;
          overflow: visible;
        }
        .app {
          display: block;
          height: auto;
        }
        #editor {
          height: auto;
          padding: 0;
          font-size: 12pt;
          white-space: pre-wrap;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#editor">Skip to editor</a>

    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Notes">
        <div class="sidebar__head">
          <span class="brand">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="M3.5 1.75h6.25L13 5v9.25H3.5z" />
              <path d="M9.5 1.9V5.2h3.2M5.9 8.3h4.4M5.9 11h3" />
            </svg>
            Notepad
          </span>
          <button
            class="btn btn--primary"
            id="new-note"
            title="New note (Ctrl+N)"
          >
            New
          </button>
        </div>

        <div class="sidebar__tools">
          <label class="field">
            <svg
              width="13"
              height="13"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              aria-hidden="true"
            >
              <circle cx="7" cy="7" r="4.25" />
              <path d="M10.2 10.2 14 14" />
            </svg>
            <input
              type="search"
              id="note-filter"
              placeholder="Search notes"
              aria-label="Search notes"
              autocomplete="off"
            />
          </label>
          <div class="sort-row">
            <label for="sort-mode">Sort</label>
            <select id="sort-mode">
              <option value="updated">Last edited</option>
              <option value="created">Date created</option>
              <option value="title">Title (A-Z)</option>
            </select>
          </div>
        </div>

        <ul class="note-list" id="note-list" role="listbox" aria-label="Notes">
          <!-- rendered by notepad-ui -->
        </ul>

        <div class="sidebar__foot">
          <div class="row" id="trash-row" hidden>
            <button class="btn btn--ghost btn--grow" id="restore-trash">
              Restore last deleted
            </button>
          </div>
          <div class="row">
            <button class="btn btn--ghost btn--grow" id="import-btn">
              Import
            </button>
            <button class="btn btn--ghost btn--grow" id="export-all">
              Export all
            </button>
          </div>
          <input
            type="file"
            id="file-input"

    <script id="notepad-core">

            pad(date.getMonth() + 1) +
            '-' +
            pad(date.getDate()) +

            ':' +

          el['stat-words'].textContent = plural(stats.words, 'word', 'words');
          el['stat-chars'].textContent = plural(stats.characters, 'character', 'characters');
          el['stat-lines'].textContent = plural(stats.lines, 'line', 'lines');
          el['stat-reading'].textContent = stats.readingMinutes
            ? stats.readingMinutes + ' min read'
            : '';
        }

        /** One row of the note list, built from nodes so text stays text. */
        function noteRow(note, query, activeId) {
          var item = element('li', 'note-item');
          item.setAttribute('role', 'option');
          item.dataset.id = note.id;
          var selected = note.id === activeId;
          item.setAttribute('aria-selected', selected ? 'true' : 'false');
          item.tabIndex = selected ? 0 : -1;

          var title = element('span', 'note-item__title');
          if (note.pinned) {
            var pin = element('span', 'note-item__pin', '●');
            pin.setAttribute('aria-label', 'pinned');
            title.appendChild(pin);
          }
          title.appendChild(element('span', 'note-item__name', core.displayTitle(note)));
          item.appendChild(title);

          var meta = element('span', 'note-item__meta');
          meta.appendChild(
            element('span', null, core.formatRelativeTime(note.updatedAt, Date.now())),
          );
          meta.appendChild(element('span', null, plural(wordsIn(note), 'word', 'words')));
          item.appendChild(meta);

          var snippet = element('span', 'note-item__snippet');
          if (query) {
            var excerpt = core.searchSnippet(note, query);
            if (excerpt.start === -1) {
              snippet.textContent = excerpt.text;
            } else {
              snippet.appendChild(document.createTextNode(excerpt.text.slice(0, excerpt.start)));
              snippet.appendChild(
                element('mark', null, excerpt.text.slice(excerpt.start, excerpt.end)),
              );
              snippet.appendChild(document.createTextNode(excerpt.text.slice(excerpt.end)));
            }
          } else {
            snippet.textContent = core.snippetOf(note);
          }
          if (snippet.textContent !== '') item.appendChild(snippet);

          return item;
        }

        function renderList() {
          var query = el['note-filter'].value;
          var active = store.activeNote();
          var activeId = active ? active.id : null;
          var notes = store.listNotes({ query: query });
          // Rows are rebuilt from scratch, so keyboard focus has to be handed
          // to the equivalent row afterwards or arrow-key navigation dies.
          var listHadFocus = el['note-list'].contains(document.activeElement);

          clear(el['note-list']);
          if (notes.length === 0) {
            var message = query.trim()
              ? 'No notes match “' + query.trim() + '”'
              : 'No notes yet';
            var empty = element('li', 'empty-note', message);
            empty.setAttribute('role', 'presentation');
            el['note-list'].appendChild(empty);
          } else {
            notes.forEach(function (note) {
              el['note-list'].appendChild(noteRow(note, query, activeId));
            });
          }

          if (listHadFocus) {
            var focusRow = el['note-list'].querySelector(
              '.note-item[aria-selected="true"]',
            );
            if (focusRow) focusRow.focus();
          }

          var trash = store.trash();
          el['trash-row'].hidden = trash.length === 0;
          if (trash.length > 0) {
            el['restore-trash'].textContent =
              'Restore “' + core.displayTitle(trash[0]) + '”';
          }
        }

        function renderToolbar() {
          var note = store.activeNote();
          el['undo-btn'].disabled = !history.canUndo();
          el['redo-btn'].disabled = !history.canRedo();
          el['pin-btn'].setAttribute('aria-pressed', note && note.pinned ? 'true' : 'false');
          el['pin-btn'].textContent = note && note.pinned ? 'Pinned' : 'Pin';
          document.title = note && (note.title || note.content)
            ? core.displayTitle(note) + ' - Notepad'
            : 'Notepad';
        }

        function renderSettings() {
          var settings = store.settings();
          root.dataset.theme = settings.theme;
          root.dataset.font = settings.font;
          root.dataset.wrap = settings.wrap ? 'on' : 'off';
          root.style.setProperty('--editor-size', settings.fontSize + 'px');
          el.editor.spellcheck = settings.spellcheck;
          el['set-font'].value = settings.font;
          el['set-size'].value = String(settings.fontSize);
          el['set-wrap'].checked = settings.wrap;
          el['set-spell'].checked = settings.spellcheck;
          el['sort-mode'].value = settings.sort;
          [].forEach.call(
            el['settings-panel'].querySelectorAll('[data-theme-choice]'),
            function (button) {
              button.setAttribute(
                'aria-pressed',
                button.dataset.themeChoice === settings.theme ? 'true' : 'false',
              );
            },
          );
        }

        function renderEditor() {
          var note = store.activeNote();
          if (!note) return;
          if (note.id !== renderedNoteId) {
            renderedNoteId = note.id;
            el.editor.value = note.content;
            el['note-title'].value = note.title;
            el.editor.setSelectionRange(note.content.length, note.content.length);
            history.reset(snapshot());
            lastEditAt = 0;
            runSearch();
            return;
          }
          if (el.editor.value !== note.content) el.editor.value = note.content;
          if (
            el['note-title'].value !== note.title &&
            document.activeElement !== el['note-title']
          ) {
            el['note-title'].value = note.title;
          }
        }

        function render() {
          renderSettings();
          renderEditor();
          renderList();
          renderStats();
          renderToolbar();
        }

        store.subscribe(function (change) {
          if (change.type === 'content') {
            renderList();
            renderStats();
            renderToolbar();
          } else {
            render();
          }
          scheduleSave();
        });

        /* ---------------------------------------------------------------
           Editing
           --------------------------------------------------------------- */
        // Input types that are a single deliberate action rather than typing,
        // and so must never be merged into the previous undo step.
        var FORCE_BREAK = /paste|drop|deleteByCut|deleteHardLine|deleteWord|deleteSoftLine|insertReplacementText|insertFromDrop|history/i;

        function onEditorInput(event) {
          var now = Date.now();
          var elapsed = lastEditAt === 0 ? Infinity : now - lastEditAt;
          lastEditAt = now;
          history.commit(snapshot(), {
            elapsedMs: elapsed,
            force: Boolean(event && event.inputType && FORCE_BREAK.test(event.inputType)),
          });
          var note = store.activeNote();
          if (note) store.setContent(note.id, el.editor.value);
          renderToolbar();
          if (!el['find-bar'].hidden) runSearch();
        }

        /** Write text into the editor from code (undo, replace, indent). */
        function applyText(text, selectionStart, selectionEnd, options) {
          el.editor.value = text;
          el.editor.setSelectionRange(selectionStart, selectionEnd);
          if (!options || options.commit !== false) {
            history.commit(snapshot(), { force: true });
          }
          var note = store.activeNote();
          if (note) store.setContent(note.id, text);
          renderStats();
          renderToolbar();
          if (!el['find-bar'].hidden) runSearch();
        }

        function applySnapshot(snap) {
          el.editor.value = snap.content;
          el.editor.setSelectionRange(snap.selectionStart, snap.selectionEnd);
          var note = store.activeNote();
          if (note) store.setContent(note.id, snap.content);
          el.editor.focus();
          renderStats();
          renderToolbar();
          if (!el['find-bar'].hidden) runSearch();
        }

        function undo() {
          var snap = history.undo();
          if (!snap) return false;
          applySnapshot(snap);
          return true;
        }

        function redo() {
          var snap = history.redo();
          if (!snap) return false;
          applySnapshot(snap);
          return true;
        }

        function indent(outdent) {
          var result = core.indentSelection(
            el.editor.value,
            el.editor.selectionStart,
            el.editor.selectionEnd,
            { outdent: outdent },
          );
          if (result.text === el.editor.value) return;
          applyText(result.text, result.selectionStart, result.selectionEnd);
        }

        /* ---------------------------------------------------------------
           Find and replace
           --------------------------------------------------------------- */
        function findOptions() {
          return {
            matchCase: el['opt-case'].checked,
            wholeWord: el['opt-word'].checked,
            useRegex: el['opt-regex'].checked,
          };
        }

        function setFindCount(message) {
          el['find-count'].textContent = message;
        }

        function runSearch() {
          var query = el['find-input'].value;
          search.valid = true;
          if (query === '') {
            search.matches = [];
            search.index = -1;
            el['find-bar'].classList.remove('is-invalid');
            setFindCount('');
            return;
          }
          try {
            search.matches = core.findMatches(el.editor.value, query, findOptions());
          } catch (error) {
            search.matches = [];
            search.index = -1;
            search.valid = false;
            el['find-bar'].classList.add('is-invalid');
            setFindCount('Invalid pattern');
            return;
          }
          el['find-bar'].classList.remove('is-invalid');
          if (search.matches.length === 0) {
            search.index = -1;
            setFindCount('No results');
            return;
          }
          if (search.index >= search.matches.length) search.index = -1;
          // When the caret already sits on a match, name it: "2 of 7" tells a
          // reader more than "7 results".
          if (search.index === -1) currentMatch();
          setFindCount(
            search.index === -1
              ? plural(search.matches.length, 'result', 'results')
              : search.index + 1 + ' of ' + search.matches.length,
          );
        }

        function scrollMatchIntoView(match) {
          var line = core.cursorPosition(el.editor.value, match.start).line;
          var lineHeight = parseFloat(window.getComputedStyle(el.editor).lineHeight);
          if (!isFinite(lineHeight) || lineHeight < 6) lineHeight = 22;
          var offset = (line - 1) * lineHeight - el.editor.clientHeight / 2;
          el.editor.scrollTop = Math.max(0, offset);
        }

        function findNext(direction) {
          runSearch();
          if (search.matches.length === 0) return false;
          var from = direction < 0 ? el.editor.selectionStart : el.editor.selectionEnd;
          var index = core.nextMatchIndex(search.matches, from, direction);
          if (index === -1) return false;
          search.index = index;
          var match = search.matches[index];
          el.editor.setSelectionRange(match.start, match.end);
          scrollMatchIntoView(match);
          setFindCount(index + 1 + ' of ' + search.matches.length);
          renderStats();
          return true;
        }

        function currentMatch() {
          // The match the caret is sitting on, if any.
          var start = el.editor.selectionStart;
          var end = el.editor.selectionEnd;
          for (var i = 0; i < search.matches.length; i += 1) {
            if (search.matches[i].start === start && search.matches[i].end === end) {
              search.index = i;
              return search.matches[i];
            }
          }
          return null;
        }

        function replaceOne() {
          runSearch();
          if (search.matches.length === 0) return false;
          var match = currentMatch();
          if (!match) return findNext(1);

          var result = core.replaceMatch(
            el.editor.value,
            match,
            el['replace-input'].value,
            findOptions(),
          );
          applyText(result.text, result.selectionEnd, result.selectionEnd);
          findNext(1);
          return true;
        }

        function replaceAll() {
          runSearch();
          if (search.matches.length === 0) {
            toast('Nothing to replace');
            return 0;
          }
          var result = core.replaceAllMatches(
            el.editor.value,
            el['find-input'].value,
            el['replace-input'].value,
            findOptions(),
          );
          var caret = Math.min(el.editor.selectionStart, result.text.length);
          applyText(result.text, caret, caret);
          toast('Replaced ' + plural(result.count, 'match', 'matches'));
          return result.count;
        }

        function openFind(options) {
          var opts = options || {};
          el['find-bar'].hidden = false;
          el['find-btn'].setAttribute('aria-expanded', 'true');
          var selected = el.editor.value.slice(
            el.editor.selectionStart,
            el.editor.selectionEnd,
          );
          if (selected !== '' && selected.indexOf('\n') === -1) {
            el['find-input'].value = selected;
          }
          runSearch();
          var target = opts.replace ? el['replace-input'] : el['find-input'];
          target.focus();
          target.select();
        }

        function closeFind() {
          el['find-bar'].hidden = true;
          el['find-btn'].setAttribute('aria-expanded', 'false');
          el['find-bar'].classList.remove('is-invalid');
          search.matches = [];
          search.index = -1;
          el.editor.focus();
        }

        /* ---------------------------------------------------------------
           Notes, files, overlays
           --------------------------------------------------------------- */
        function toast(message, action) {
          clear(el.toast);
          el.toast.appendChild(element('span', null, message));
          if (action) {
            var button = element('button', 'btn', action.label);
            button.addEventListener('click', function () {
              hideToast();
              action.onAction();
            });
            el.toast.appendChild(button);
          }
          el.toast.hidden = false;
          if (toastTimer !== null) window.clearTimeout(toastTimer);
          toastTimer = window.setTimeout(hideToast, TOAST_MS);
        }

        function hideToast() {
          if (toastTimer !== null) {
            window.clearTimeout(toastTimer);
            toastTimer = null;
          }
          el.toast.hidden = true;
          clear(el.toast);
        }

        function newNote() {
          store.createNote({});
          el.editor.focus();
          if (isNarrow()) setSidebar(false);
        }

        function deleteActiveNote() {
          var note = store.activeNote();
          if (!note) return;
          store.deleteNote(note.id);
          toast('Deleted “' + core.displayTitle(note) + '”', {
            label: 'Undo',
            onAction: function () {
              store.restoreLast();
              el.editor.focus();
            },
          });
        }

        /** The seam UI tests replace to inspect what would have been saved. */
        function download(payload) {
          var url;
          var objectUrl = false;
          if (
            window.URL &&
            typeof window.URL.createObjectURL === 'function' &&
            typeof window.Blob === 'function'
          ) {
            url = window.URL.createObjectURL(
              new window.Blob([payload.text], { type: payload.type }),
            );
            objectUrl = true;
          } else {
            url =
              'data:' + payload.type + ';charset=utf-8,' + encodeURIComponent(payload.text);
          }
          var anchor = element('a');
          anchor.href = url;
          anchor.download = payload.filename;
          anchor.rel = 'noopener';
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
          if (objectUrl) {
            window.setTimeout(function () {
              window.URL.revokeObjectURL(url);
            }, 10000);
          }
          return true;
        }

        function downloadActive() {
          var note = store.activeNote();
          if (!note) return;
          api.download({
            filename: core.filenameFor(note, '.txt'),
            text: note.content,
            type: 'text/plain',
          });
        }

        function exportAll() {
          var bundle = core.exportBundle(store.notes(), {
            now: function () {
              return Date.now();
            },
          });
          api.download({
            filename: 'notepad-export-' + bundle.exportedAt.slice(0, 10) + '.json',
            text: JSON.stringify(bundle, null, 2),
            type: 'application/json',
          });
        }

        function readFile(file) {
          if (typeof file.text === 'string') {
            return Promise.resolve({ name: file.name, text: file.text });
          }
          if (typeof file.text === 'function') {
            return file.text().then(function (text) {
              return { name: file.name, text: text };
            });
          }
          return new Promise(function (resolve, reject) {
            var reader = new window.FileReader();
            reader.onload = function () {
              resolve({ name: file.name, text: String(reader.result) });
            };
            reader.onerror = function () {
              reject(new Error('unreadable'));
            };
            reader.readAsText(file);
          });
        }

        function importFiles(files) {
          var list = [].slice.call(files || []);
          if (list.length === 0) return Promise.resolve(null);

          return Promise.all(
            list.map(function (file) {
              return readFile(file).then(
                function (payload) {
                  return core.parseImportedFile(payload, {
                    uid: makeUid(),
                    now: Date.now,
                  });
                },
                function () {
                  return null;
                },
              );
            }),
          ).then(function (results) {
            var notes = [];
            var failed = 0;
            results.forEach(function (result) {
              if (!result) {
                failed += 1;
                return;
              }
              notes = notes.concat(result.notes);
            });

            var summary = store.importNotes(notes);
            var parts = [];
            if (summary.added) parts.push(summary.added + ' added');
            if (summary.updated) parts.push(summary.updated + ' updated');
            if (summary.skipped) parts.push(summary.skipped + ' unchanged');
            if (failed) parts.push(failed + ' unreadable');
            toast(
              parts.length
                ? 'Import complete: ' + parts.join(', ')
                : 'Nothing to import',
            );
            el.editor.focus();
            return summary;
          });
        }

        function openGoto(open) {
          el['goto-panel'].hidden = !open;
          el['stat-caret'].setAttribute('aria-expanded', open ? 'true' : 'false');
          if (!open) return;
          // Anchor the panel above the readout it belongs to, wherever the
          // status bar happens to start.
          var anchor = el['stat-caret'].getBoundingClientRect();
          if (anchor.width > 0) {
            el['goto-panel'].style.left = Math.max(8, anchor.left - 8) + 'px';
            el['goto-panel'].style.bottom =
              Math.max(8, window.innerHeight - anchor.top + 8) + 'px';
          }
          el['goto-line'].value = String(
            core.cursorPosition(el.editor.value, el.editor.selectionStart).line,
          );
          el['goto-line'].focus();
          el['goto-line'].select();
        }

        function gotoLine() {
          var target = core.lineRange(el.editor.value, el['goto-line'].value);
          openGoto(false);
          el.editor.focus();
          el.editor.setSelectionRange(target.start, target.start);
          scrollMatchIntoView(target);
          renderStats();
        }

        /** Windows Notepad's F5: stamp the date and time at the caret. */
        function stampDateTime() {
          var stamp = core.formatDateTime(Date.now());
          var value = el.editor.value;
          var at = el.editor.selectionStart;
          var to = el.editor.selectionEnd;
          applyText(value.slice(0, at) + stamp + value.slice(to), at + stamp.length, at + stamp.length);
        }

        function isNarrow() {
          return window.innerWidth <= NARROW_PX;
        }

        function setSidebar(expanded) {
          root.dataset.sidebar = expanded ? 'expanded' : 'collapsed';
          el['toggle-sidebar'].setAttribute('aria-expanded', expanded ? 'true' : 'false');
        }

        function sidebarExpanded() {
          return root.dataset.sidebar === 'expanded';
        }

        function openSettings(open) {
          el['settings-panel'].hidden = !open;
          el['settings-btn'].setAttribute('aria-expanded', open ? 'true' : 'false');
          if (open) el['set-font'].focus();
        }

        function openHelp(open) {
          el['help-modal'].hidden = !open;
          el.backdrop.hidden = !open;
          if (open) el['help-close'].focus();
          else el.editor.focus();
        }

        function closeOverlays() {
          if (!el['help-modal'].hidden) {
            openHelp(false);
            return true;
          }
          if (!el['settings-panel'].hidden) {
            openSettings(false);
            el['settings-btn'].focus();
            return true;
          }
          if (!el['goto-panel'].hidden) {
            openGoto(false);
            el.editor.focus();
            return true;
          }
          if (!el['find-bar'].hidden) {
            closeFind();
            return true;
          }
          if (!el.toast.hidden) {
            hideToast();
            return true;
          }
          if (isNarrow() && sidebarExpanded()) {
            setSidebar(false);
            return true;
          }
          return false;
        }

        /* ---------------------------------------------------------------
           Keyboard shortcuts
           --------------------------------------------------------------- */
        var SHORTCUTS = [
          ['New note', 'Ctrl N'],
          ['Find and replace', 'Ctrl F'],
          ['Find next / previous', 'Enter / Shift Enter'],
          ['Replace in note', 'Ctrl H'],
          ['Undo', 'Ctrl Z'],
          ['Redo', 'Ctrl Shift Z'],
          ['Download note', 'Ctrl S'],
          ['Indent / outdent', 'Tab / Shift Tab'],
          ['Go to line', 'Ctrl G'],
          ['Insert date and time', 'F5'],
          ['Previous / next note', 'Alt ↑ / Alt ↓'],
          ['Toggle note list', 'Ctrl B'],
          ['Search notes', 'Ctrl Shift F'],
          ['Keyboard shortcuts', '?'],
          ['Close panel', 'Esc'],
        ];

        var MAC_KEYS = { Ctrl: '\u2318', Alt: '\u2325', Shift: '\u21e7' };

        function renderShortcuts() {
          var mac = /Mac|iPhone|iPad/i.test(
            (window.navigator && window.navigator.platform) || '',
          );
          clear(el['shortcut-list']);
          SHORTCUTS.forEach(function (pair) {
            var row = element('div');
            row.appendChild(element('dt', null, pair[0]));
            var keys = element('dd');
            pair[1].split(' ').forEach(function (key, index) {
              if (index > 0) keys.appendChild(document.createTextNode(' '));
              if (key === '/') {
                // punctuation between two shortcuts, not a key to press
                keys.appendChild(document.createTextNode('/'));
                return;
              }
              keys.appendChild(element('kbd', null, (mac && MAC_KEYS[key]) || key));
            });
            row.appendChild(keys);
            el['shortcut-list'].appendChild(row);
          });
        }

        function isTypingTarget(node) {
          if (!node) return false;
          var tag = node.tagName;
          return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
        }

        function moveSelection(step) {
          var notes = store.listNotes({ query: el['note-filter'].value });
          if (notes.length === 0) return;
          var active = store.activeNote();
          var at = -1;
          notes.forEach(function (note, index) {
            if (active && note.id === active.id) at = index;
          });
          var next = at === -1 ? 0 : (at + step + notes.length) % notes.length;
          store.select(notes[next].id);
          el.editor.focus();
        }

        document.addEventListener('keydown', function (event) {
          var accel = event.ctrlKey || event.metaKey;
          var key = event.key;

          if (key === 'Escape') {
            if (event.target === el['note-filter'] && el['note-filter'].value !== '') {
              event.preventDefault();
              el['note-filter'].value = '';
              renderList();
              return;
            }
            if (closeOverlays()) event.preventDefault();
            return;
          }

          // aria-modal is a promise to keep focus inside the dialog.
          if (key === 'Tab' && !el['help-modal'].hidden) {
            var focusable = [].slice.call(
              el['help-modal'].querySelectorAll(
                'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])',
              ),
            );
            if (focusable.length > 0) {
              event.preventDefault();
              var at = focusable.indexOf(document.activeElement);
              var step = event.shiftKey ? -1 : 1;
              var target = focusable[(at + step + focusable.length) % focusable.length];
              target.focus();
            }
            return;
          }

          if (accel && !event.altKey) {
            var lower = typeof key === 'string' ? key.toLowerCase() : '';
            if (lower === 'n' && !event.shiftKey) {
              event.preventDefault();
              newNote();
              return;
            }
            if (lower === 's') {
              event.preventDefault();
              downloadActive();
              return;
            }
            if (lower === 'f' && event.shiftKey) {
              event.preventDefault();
              if (isNarrow()) setSidebar(true);
              el['note-filter'].focus();
              el['note-filter'].select();
              return;
            }
            if (lower === 'f') {
              event.preventDefault();
              openFind();
              return;
            }
            if (lower === 'h') {
              event.preventDefault();
              openFind({ replace: true });
              return;
            }
            if (lower === 'b') {
              event.preventDefault();
              setSidebar(!sidebarExpanded());
              return;
            }
            if (lower === 'g') {
              event.preventDefault();
              openGoto(el['goto-panel'].hidden);
              return;
            }
          }

          if (accel && (key === 'z' || key === 'Z' || key === 'y' || key === 'Y')) {
            var inEditor = event.target === el.editor || !isTypingTarget(event.target);
            if (!inEditor) return;
            event.preventDefault();
            var wantsRedo = key === 'y' || key === 'Y' || event.shiftKey;
            if (wantsRedo) redo();
            else undo();
            return;
          }

          if (event.altKey && !accel && (key === 'ArrowUp' || key === 'ArrowDown')) {
            event.preventDefault();
            moveSelection(key === 'ArrowUp' ? -1 : 1);
            return;
          }

          if (key === '?' && !isTypingTarget(event.target)) {
            event.preventDefault();
            openHelp(true);
            return;
          }

          if (key === 'F5' && !accel && !event.shiftKey) {
            event.preventDefault();
            el.editor.focus();
            stampDateTime();
            return;
          }

          if (key === 'F3') {
            event.preventDefault();
            if (el['find-bar'].hidden) openFind();
            else findNext(event.shiftKey ? -1 : 1);
          }
        });

        el.editor.addEventListener('keydown', function (event) {
          if (event.key === 'Tab' && !event.ctrlKey && !event.metaKey && !event.altKey) {
            event.preventDefault();
            indent(event.shiftKey);
          }
        });

        /* ---------------------------------------------------------------
           Wiring
           --------------------------------------------------------------- */
        el.editor.addEventListener('input', onEditorInput);
        ['keyup', 'click', 'select', 'focus'].forEach(function (name) {
          el.editor.addEventListener(name, renderStats);
        });

        el['note-title'].addEventListener('input', function () {
          var note = store.activeNote();
          if (note) store.setTitle(note.id, el['note-title'].value);
        });

        el['note-title'].addEventListener('keydown', function (event) {
          if (event.key !== 'Enter') return;
          event.preventDefault();
          el.editor.focus();
        });

        el['new-note'].addEventListener('click', newNote);
        el['delete-btn'].addEventListener('click', deleteActiveNote);
        el['download-btn'].addEventListener('click', downloadActive);
        el['export-all'].addEventListener('click', exportAll);
        el['undo-btn'].addEventListener('click', undo);
        el['redo-btn'].addEventListener('click', redo);

        el['pin-btn'].addEventListener('click', function () {
          var note = store.activeNote();
          if (note) store.togglePin(note.id);
        });

        el['restore-trash'].addEventListener('click', function () {
          store.restoreLast();
          el.editor.focus();
        });

        el['note-filter'].addEventListener('input', renderList);
        el['sort-mode'].addEventListener('change', function () {
          store.setSetting('sort', el['sort-mode'].value);
        });

        el['note-list'].addEventListener('click', function (event) {
          var row = event.target.closest ? event.target.closest('.note-item') : null;
          if (!row) return;
          store.select(row.dataset.id);
          if (isNarrow()) setSidebar(false);
          el.editor.focus();
        });

        el['note-list'].addEventListener('keydown', function (event) {
          var rows = [].slice.call(el['note-list'].querySelectorAll('.note-item'));
          if (rows.length === 0) return;
          var at = rows.indexOf(document.activeElement);
          var target = null;
          if (event.key === 'ArrowDown') target = rows[Math.min(rows.length - 1, at + 1)];
          else if (event.key === 'ArrowUp') target = rows[Math.max(0, at - 1)];
          else if (event.key === 'Home') target = rows[0];
          else if (event.key === 'End') target = rows[rows.length - 1];
          else if (event.key === 'Enter' || event.key === ' ') {
            if (at !== -1) {
              event.preventDefault();
              store.select(rows[at].dataset.id);
              el.editor.focus();
            }
            return;
          }
          if (!target) return;
          event.preventDefault();
          target.focus();
          store.select(target.dataset.id);
        });

        el['toggle-sidebar'].addEventListener('click', function () {
          setSidebar(!sidebarExpanded());
        });
        el['sidebar-scrim'].addEventListener('click', function () {
          setSidebar(false);
        });

        el['import-btn'].addEventListener('click', function () {
          el['file-input'].click();
        });
        el['file-input'].addEventListener('change', function () {
          var files = el['file-input'].files;
          api.importFiles(files);
          el['file-input'].value = '';
        });

        ['dragover', 'dragenter'].forEach(function (name) {
          el.editor.addEventListener(name, function (event) {
            if (event.dataTransfer) event.preventDefault();
          });
        });
        el.editor.addEventListener('drop', function (event) {
          var files = event.dataTransfer && event.dataTransfer.files;
          if (!files || files.length === 0) return;
          event.preventDefault();
          api.importFiles(files);
        });

        el['find-btn'].addEventListener('click', function () {
          if (el['find-bar'].hidden) openFind();
          else closeFind();
        });
        el['find-close'].addEventListener('click', closeFind);
        el['find-next'].addEventListener('click', function () {
          findNext(1);
        });
        el['find-prev'].addEventListener('click', function () {
          findNext(-1);
        });
        el['replace-one'].addEventListener('click', replaceOne);
        el['replace-all'].addEventListener('click', replaceAll);
        el['find-input'].addEventListener('input', function () {
          search.index = -1;
          runSearch();
        });
        [el['opt-case'], el['opt-word'], el['opt-regex']].forEach(function (box) {
          box.addEventListener('change', function () {
            search.index = -1;
            runSearch();
          });
        });
        [el['find-input'], el['replace-input']].forEach(function (input) {
          input.addEventListener('keydown', function (event) {
            if (event.key !== 'Enter') return;
            event.preventDefault();
            if (input === el['replace-input']) replaceOne();
            else findNext(event.shiftKey ? -1 : 1);
          });
        });

        el['stat-caret'].addEventListener('click', function () {
          openGoto(el['goto-panel'].hidden);
        });
        el['goto-go'].addEventListener('click', gotoLine);
        el['goto-line'].addEventListener('keydown', function (event) {
          if (event.key !== 'Enter') return;
          event.preventDefault();
          gotoLine();
        });

        el['settings-btn'].addEventListener('click', function () {
          openSettings(el['settings-panel'].hidden);
        });
        el['help-btn'].addEventListener('click', function () {
          openHelp(true);
        });
        el['help-close'].addEventListener('click', function () {
          openHelp(false);
        });
        el.backdrop.addEventListener('click', function () {
          openHelp(false);
        });

        [].forEach.call(
          el['settings-panel'].querySelectorAll('[data-theme-choice]'),
          function (button) {
            button.addEventListener('click', function () {
              store.setSetting('theme', button.dataset.themeChoice);
            });
          },
        );
        el['set-font'].addEventListener('change', function () {
          store.setSetting('font', el['set-font'].value);
        });
        el['set-size'].addEventListener('input', function () {
          store.setSetting('fontSize', Number(el['set-size'].value));
        });
        el['set-wrap'].addEventListener('change', function () {
          store.setSetting('wrap', el['set-wrap'].checked);
        });
        el['set-spell'].addEventListener('change', function () {
          store.setSetting('spellcheck', el['set-spell'].checked);
        });

        document.addEventListener('click', function (event) {
          if (
            !el['goto-panel'].hidden &&
            !el['goto-panel'].contains(event.target) &&
            !el['stat-caret'].contains(event.target)
          ) {
            openGoto(false);
          }
          if (el['settings-panel'].hidden) return;
          if (
            el['settings-panel'].contains(event.target) ||
            el['settings-btn'].contains(event.target)
          ) {
            return;
          }
          openSettings(false);
        });

        // Crossing the phone/desktop threshold changes what the note list is:
        // a column on the side, or a drawer over the editor. Keep the two in
        // step so a resized window never leaves the drawer covering the page.
        var wasNarrow = isNarrow();
        window.addEventListener('resize', function () {
          var narrow = isNarrow();
          if (narrow === wasNarrow) return;
          wasNarrow = narrow;
          setSidebar(!narrow);
        });

        // Two tabs on the same notes would otherwise overwrite each other in
        // silence. Ask instead: this tab keeps what it has until told.
        window.addEventListener('storage', function (event) {
          if (!event || event.key !== core.STORAGE_KEY || !event.newValue) return;
          var incoming = core.parseState(event.newValue, {
            uid: makeUid(),
            now: Date.now,
          });
          if (!incoming) return;
          toast('Notes were changed in another tab', {
            label: 'Load them',
            onAction: function () {
              renderedNoteId = null;
              if (store.hydrate(incoming)) el.editor.focus();
            },
          });
        });

        window.addEventListener('pagehide', saveNow);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') saveNow();
        });

        /* ---------------------------------------------------------------
           Boot
           --------------------------------------------------------------- */
        renderShortcuts();
        setSidebar(!isNarrow());
        render();
        setSaveState('idle', '');
        if (!storage.available) {
          showStorageBanner(
            'This browser cannot store notes (private mode or blocked storage), ' +
              'so nothing will be kept when you close the tab. Download to keep a copy.',
          );
          setSaveState('error', 'Not saved');
        }
        el.editor.focus();

        api.store = store;
        api.history = history;
        api.core = core;
        api.render = render;
        api.renderList = renderList;
        api.renderStats = renderStats;
        api.flushPendingSave = saveNow;
        api.download = download;
        api.downloadActive = downloadActive;
        api.exportAll = exportAll;
        api.importFiles = importFiles;
        api.openFind = openFind;
        api.closeFind = closeFind;
        api.findNext = findNext;
        api.replaceOne = replaceOne;
        api.replaceAll = replaceAll;
        api.undo = undo;
        api.redo = redo;
        api.newNote = newNote;
        api.deleteActiveNote = deleteActiveNote;
        api.toast = toast;
        api.hideToast = hideToast;
        api.setSidebar = setSidebar;
        api.openSettings = openSettings;
        api.openGoto = openGoto;
        api.gotoLine = gotoLine;
        api.stampDateTime = stampDateTime;
        api.openHelp = openHelp;
        api.storageAvailable = storage.available;
        api.timings = { saveDebounceMs: SAVE_DEBOUNCE_MS, toastMs: TOAST_MS };

        window.notepadApp = api;
      })(window, document, window.NotepadCore);
    </script>
  </body>
</html>
