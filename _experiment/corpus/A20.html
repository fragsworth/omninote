    'import-files': function () { byId('file-input').click(); },
    'export-txt': function () { exportNote('txt'); },
    'export-md': function () { exportNote('md'); },
    'export-all': exportAll,
    print: printNote,
    'save-now': function () { if (saveNow()) toast('Saved'); },
    'zoom-in': function () { updatePrefs({ fontSize: prefs.fontSize + 1 }); },
    'zoom-out': function () { updatePrefs({ fontSize: prefs.fontSize - 1 }); },
    'zoom-reset': function () { updatePrefs({ fontSize: settingsApi.defaults().fontSize }); },
  };

  function toggleFindOption(key) {
    ui.find[key] = !ui.find[key];
    renderToolbar();
    updateMatches();
  }

  /**
   * Run a command by name. Text transforms are namespaced "transform:<name>".
   * @returns {boolean} whether anything handled it
   */
  function runAction(name, element, event) {
    if (!name) return false;
    if (name.indexOf('transform:') === 0) {
      runTransform(name.slice('transform:'.length));
      return true;
    }
    var handler = ACTIONS[name];
    if (!handler) return false;
    handler(event, element);
    return true;
  }

  /** Keys that only apply inside the editor. */
  function editorKeydown(event) {
    var options = { tabSize: prefs.tabSize, useTabs: prefs.useTabs };

    if (event.key === 'Tab' && !event.ctrlKey && !event.metaKey && !event.altKey) {
      event.preventDefault();
      applyResult(event.shiftKey
        ? edit.outdent(input.value, selection(), options)
        : edit.indent(input.value, selection(), options), 'indent');
      return;
    }

    if (event.key === 'Enter' && prefs.autoIndent &&
        !event.shiftKey && !event.ctrlKey && !event.metaKey && !event.altKey) {
      event.preventDefault();
      applyResult(edit.newlineIndent(input.value, selection()), 'typing');
      return;
    }

    if (event.altKey && !event.ctrlKey && !event.metaKey &&
        (event.key === 'ArrowUp' || event.key === 'ArrowDown')) {
      event.preventDefault();
      if (event.shiftKey) runTransform('duplicate-lines');
      else runTransform(event.key === 'ArrowDown' ? 'move-down' : 'move-up');
      return;
    }

    if (event.ctrlKey && event.shiftKey && (event.key === 'K' || event.key === 'k')) {
      event.preventDefault();
      runTransform('delete-lines');
    }
  }

  /** Application-wide shortcuts. */
  function globalKeydown(event) {
    if (ui.dialog) {
      dialogKeydown(event);
      if (event.defaultPrevented) return;
    }
    if (ui.menu) {
      menuKeydown(event);
      if (event.defaultPrevented) return;
    }

    var mod = event.ctrlKey || event.metaKey;
    var key = event.key;

    if (key === 'Escape') {
      if (ui.menu) closeMenu();
      else if (ui.dialog) closeDialog();
      else if (ui.findOpen) closeFind();
      return;
    }

    if (key === 'F1') {
      event.preventDefault();
      shortcutsDialog();
      return;
    }

    if (mod && event.altKey && (key === 'n' || key === 'N')) {
      event.preventDefault();
      newNote('');
      return;
    }

    if (event.altKey && event.shiftKey && (key === 'd' || key === 'D')) {
      event.preventDefault();
      runAction('insert-datetime');
      return;
    }

    if (mod && !event.altKey) {
      switch (key) {
        case 's':
        case 'S':
          event.preventDefault();
          if (event.shiftKey) exportNote('txt');
          else runAction('save-now');
          return;
        case 'f':
        case 'F':
          event.preventDefault();
          openFind(false);
          return;
        case 'h':
        case 'H':
          event.preventDefault();
          runAction('open-replace');
          return;
        case 'g':
        case 'G':
          event.preventDefault();
          goToLineDialog();
          return;
        case 'b':
        case 'B':
          event.preventDefault();
          updatePrefs({ sidebar: !prefs.sidebar });
          return;
        case 'z':
        case 'Z':
          if (event.target === input) {
            event.preventDefault();
            restore(event.shiftKey ? hist.redo() : hist.undo());
          }
          return;
        case 'y':
        case 'Y':
          if (event.target === input) {
            event.preventDefault();
            restore(hist.redo());
          }
          return;
        case '/':
          event.preventDefault();
          shortcutsDialog();
          return;
        case '=':
        case '+':
          event.preventDefault();
          runAction('zoom-in');
          return;
        case '-':
        case '_':
          event.preventDefault();
          runAction('zoom-out');
          return;
        case '0':
          event.preventDefault();
          runAction('zoom-reset');
          return;
        default:
          break;
      }
    }

    if (event.target === input) editorKeydown(event);
  }

  /* ===================================================================== */
  /* 8. wiring and boot                                                    */
  /* ===================================================================== */

  function wire() {
    document.addEventListener('click', function (event) {
      var trigger = event.target.closest ? event.target.closest('[data-action]') : null;
      if (!trigger) {
        if (ui.menu && !ui.menu.node.contains(event.target)) closeMenu();
        return;
      }
      if (ui.menu && ui.menu.anchor !== trigger) closeMenu();
      if (runAction(trigger.getAttribute('data-action'), trigger, event)) {
        event.preventDefault();
      }
    });

    input.addEventListener('input', function (event) {
      var type = event.inputType || '';
      commit(/^(insertText|deleteContent)/.test(type) ? 'typing' : 'edit');
    });

    input.addEventListener('scroll', syncScroll);
    input.addEventListener('click', renderStatus);
    input.addEventListener('keyup', renderStatus);
    input.addEventListener('select', renderStatus);
    input.addEventListener('focus', renderStatus);

    titleField.addEventListener('input', function () {
      var note = activeNote();
      if (!note) return;
      state = notes.update(state, note.id, { title: titleField.value }, now());
      markUnsaved();
      scheduleListRender();
      byId('print-title').textContent = notes.displayTitle(activeNote());
      document.title = notes.displayTitle(activeNote()) + ' — Notepad';
    });

    titleField.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        input.focus();
      }
    });

    byId('note-search').addEventListener('input', function (event) {
      ui.listQuery = event.target.value;
      renderList();
    });

    byId('sort-mode').addEventListener('change', function (event) {
      updatePrefs({ sortMode: event.target.value });
    });

    byId('find-input').addEventListener('input', function (event) {
      ui.find.query = event.target.value;
      updateMatches();
    });

    byId('replace-input').addEventListener('input', function (event) {
      ui.find.replacement = event.target.value;
    });

    byId('find-input').addEventListener('keydown', function (event) {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      findStep(event.shiftKey ? -1 : 1);
    });

    byId('replace-input').addEventListener('keydown', function (event) {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      if (event.ctrlKey || event.metaKey) replaceAll();
      else replaceCurrent();
    });

    byId('file-input').addEventListener('change', function (event) {
      importFiles(event.target.files);
      event.target.value = '';
    });

    ['dragover', 'drop'].forEach(function (type) {
      byId('editor').addEventListener(type, function (event) {
        if (!event.dataTransfer) return;
        event.preventDefault();
        if (type === 'dragover') event.dataTransfer.dropEffect = 'copy';
        else importFiles(event.dataTransfer.files);
      });
    });

    document.addEventListener('keydown', globalKeydown);

    window.addEventListener('resize', function () {
      closeMenu();
      syncScroll();
    });

    window.addEventListener('beforeunload', function () {
      if (ui.saveState === 'unsaved') saveNow();
    });

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden' && ui.saveState === 'unsaved') saveNow();
    });

    /* Fires only in the *other* tabs of this origin. A null key means the
       whole store was cleared. */
    window.addEventListener('storage', function (event) {
      if (event.key && event.key !== storage.KEY) return;
      adoptExternalChanges();
    });

    if (window.matchMedia) {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      var onSystemTheme = function () {
        if (prefs.theme === 'system') renderChrome();
      };
      if (media.addEventListener) media.addEventListener('change', onSystemTheme);
      else if (media.addListener) media.addListener(onSystemTheme);
    }
  }

  function boot() {
    var loaded = storage.load(store, now());
    state = loaded.state;
    prefs = loaded.settings;

    if (!loaded.available) {
      ui.saveState = 'off';
      showBanner('This browser is blocking local storage, so notes will be lost ' +
        'when the tab closes. Export a backup to keep them.');
    } else if (loaded.warnings.length > 0) {
      showBanner(loaded.warnings.join(' '));
    }

    var note = activeNote();
    input.value = note ? note.body : '';
    hist.reset({ text: input.value, start: 0, end: 0 });

    wire();
    render();
    if (loaded.migrated && loaded.available) saveNow();
    input.focus();

    /**
     * A small, documented automation surface. The end-to-end tests drive the
     * app through this rather than reaching into private closures, and it makes
     * live state inspectable from the browser console.
     */
    window.Notepad = {
      core: Core,
      actions: ACTIONS,
      run: runAction,
      state: function () { return state; },
      prefs: function () { return prefs; },
      ui: function () { return ui; },
      save: saveNow,
    };
    document.documentElement.setAttribute('data-ready', 'true');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
