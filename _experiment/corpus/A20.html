<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Notepad — a fast, private, single-file text editor that runs entirely in your browser.">
<title>Notepad</title>
<style>
/* ==========================================================================
   Notepad — styles
   Single file, no dependencies. Organised as: tokens, reset, layout,
   components (sidebar, editor, dialogs), then responsive + print overrides.
   ========================================================================== */

/* --- design tokens ------------------------------------------------------- */
:root {
  color-scheme: light;
  --bg: #f6f6f4;
  --bg-raised: #ffffff;
  --bg-sunken: #ececea;
  --bg-hover: rgba(0, 0, 0, 0.05);
  --bg-active: rgba(0, 0, 0, 0.09);
  --border: #d9d9d4;
  --border-strong: #bcbcb5;
  --text: #1b1b1a;
  --text-muted: #6b6b66;
  --text-faint: #8d8d86;
  --accent: #1f6feb;
  --accent-text: #ffffff;
  --accent-soft: rgba(31, 111, 235, 0.12);
  --danger: #c0362c;
  --warn-bg: #fdf3d7;
  --warn-text: #6b4e00;
  --highlight: rgba(255, 214, 0, 0.55);
  --highlight-current: rgba(255, 132, 0, 0.75);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  --radius: 8px;
  --radius-sm: 5px;
  --ui-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --editor-font: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --editor-font-size: 15px;
  --editor-line-height: 1.6;
  --sidebar-width: 264px;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #16181c;
  --bg-raised: #1e2126;
  --bg-sunken: #121418;
  --bg-hover: rgba(255, 255, 255, 0.06);
  --bg-active: rgba(255, 255, 255, 0.11);
  --border: #2e323a;
  --border-strong: #454b55;
  --text: #e7e9ec;
  --text-muted: #9aa1ab;
  --text-faint: #747b85;
  --accent: #4e8cf0;
  --accent-text: #0b0e12;
  --accent-soft: rgba(78, 140, 240, 0.18);
  --danger: #f2776b;
  --warn-bg: #3a3118;
  --warn-text: #f0d999;
  --highlight: rgba(255, 214, 0, 0.38);
  --highlight-current: rgba(255, 145, 0, 0.62);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

/* --- reset -------------------------------------------------------------- */
* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--ui-font);
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

[hidden] { display: none !important; }

/* --- app shell ---------------------------------------------------------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  grid-template-rows: 100%;
  height: 100%;
}

.app[data-sidebar="hidden"] {
  grid-template-columns: 0 1fr;
}

.app[data-sidebar="hidden"] .sidebar {
  display: none;
}

/* --- sidebar ------------------------------------------------------------ */
.sidebar {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg-sunken);
  border-right: 1px solid var(--border);
}

.sidebar__head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 10px 6px;
}

.sidebar__title {
  flex: 1;
  margin: 0;
  font-size: 13px;
  font-weight: 650;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.sidebar__search {
  padding: 0 10px 8px;
}

.sidebar__tools {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px 8px;
}

.sidebar__tools label {
  font-size: 12px;
  color: var(--text-muted);
}

.note-list {
  flex: 1;
  overflow-y: auto;
  margin: 0;
  padding: 0 8px 12px;
  list-style: none;
}

.note-list__empty {
  padding: 18px 10px;
  color: var(--text-faint);
  font-size: 13px;
  text-align: center;
}

.note-row {
  position: relative;
}

.note {
  display: block;
  width: 100%;
  margin-bottom: 2px;
  padding: 8px 28px 8px 9px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.note__menu {
  position: absolute;
  top: 7px;
  right: 6px;
  padding: 1px 6px 3px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--text-faint);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
}

.note-row:hover .note__menu,
.note-row:focus-within .note__menu {
  opacity: 1;
}

.note__menu:hover {
  background: var(--bg-active);
  color: var(--text);
}

@media (hover: none) {
  .note__menu { opacity: 1; }
}

.note:hover { background: var(--bg-hover); }

.note[aria-current="true"] {
  background: var(--accent-soft);
  border-color: color-mix(in srgb, var(--accent) 35%, transparent);
}

.note__row {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.note__title {
  flex: 1;
  overflow: hidden;
  font-weight: 600;
  font-size: 13.5px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.note__pin {
  flex: none;
  font-size: 11px;
  color: var(--accent);
}

.note__meta {
  display: flex;
  gap: 6px;
  margin-top: 2px;
  color: var(--text-faint);
  font-size: 11.5px;
}

.note__preview {
  overflow: hidden;
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 12px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.note__preview mark {
  background: var(--highlight);
  color: inherit;
  border-radius: 2px;
}

.sidebar__foot {
  display: flex;
  gap: 6px;
  padding: 8px 10px;
  border-top: 1px solid var(--border);
}

/* --- main --------------------------------------------------------------- */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg-raised);
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.toolbar__group {
  display: flex;
  align-items: center;
  gap: 4px;
}

.toolbar__spacer { flex: 1; min-width: 4px; }

.toolbar__sep {
  width: 1px;
  height: 20px;
  margin: 0 4px;
  background: var(--border);
}

.title-field {
  flex: 1;
  min-width: 80px;
  max-width: 460px;
  padding: 5px 8px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  font-size: 14.5px;
  font-weight: 620;
}

.title-field:hover { border-color: var(--border); }

.title-field:focus {
  border-color: var(--accent);
  background: var(--bg-raised);
  outline: none;
}

/* --- buttons and controls ---------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 9px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-raised);
  color: var(--text);
  font-size: 13px;
  line-height: 1.35;
  white-space: nowrap;
  cursor: pointer;
}

.btn:hover:not(:disabled) { background: var(--bg-hover); }
.btn:active:not(:disabled) { background: var(--bg-active); }

.btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.btn--quiet {
  border-color: transparent;
  background: transparent;
}

.btn--quiet:hover:not(:disabled) { background: var(--bg-hover); }

.btn--primary {
  border-color: transparent;
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
}

.btn--primary:hover:not(:disabled) { filter: brightness(1.08); }

.btn--danger { color: var(--danger); }

.btn--icon {
  padding: 5px 7px;
  font-size: 14px;
}

.btn[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: color-mix(in srgb, var(--accent) 40%, transparent);
}

.field {
  width: 100%;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-raised);
}

.field:focus {
  border-color: var(--accent);
  outline: none;
}

.select { padding: 5px 6px; }

/* --- find bar ----------------------------------------------------------- */
.findbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.findbar__input { width: 160px; }
.findbar__input--invalid { border-color: var(--danger); }

.findbar__count {
  min-width: 80px;
  color: var(--text-muted);
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}

.findbar__toggles {
  display: flex;
  gap: 4px;
}

.toggle {
  padding: 4px 7px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-raised);
  font-size: 12px;
  cursor: pointer;
}

.toggle[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: color-mix(in srgb, var(--accent) 40%, transparent);
  font-weight: 600;
}

/* --- editor ------------------------------------------------------------- */
.editor {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  overflow: hidden;
}

.editor__gutter {
  flex: none;
  padding: 12px 8px 12px 10px;
  overflow: hidden;
  border-right: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-faint);
  font: var(--editor-font-size) / var(--editor-line-height) var(--editor-font);
  text-align: right;
  white-space: pre;
  user-select: none;
  -webkit-user-select: none;
}

/* Moved with a transform rather than scrollTop, which would clamp to the
   gutter's own (shorter) content and drift out of step with the text. */
.editor__gutter-lines {
  white-space: pre;
  will-change: transform;
}

.editor__scroll {
  position: relative;
  flex: 1;
  min-width: 0;
}

.editor__highlights,
.editor__input {
  position: absolute;
  inset: 0;
  margin: 0;
  padding: 12px 14px;
  border: 0;
  font: var(--editor-font-size) / var(--editor-line-height) var(--editor-font);
  letter-spacing: normal;
  tab-size: var(--tab-size, 4);
  -moz-tab-size: var(--tab-size, 4);
}

.editor__highlights {
  overflow: hidden;
  color: transparent;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  /* The textarea loses width to its scrollbar; match it or the two layers wrap
     at different points and every highlight below the fold drifts. */
  padding-right: calc(14px + var(--scrollbar-width, 0px));
}

.editor__highlights mark {
  background: var(--highlight);
  color: transparent;
  border-radius: 2px;
}

.editor__highlights mark[data-current="true"] {
  background: var(--highlight-current);
}

.editor__input {
  display: block;
  width: 100%;
  height: 100%;
  overflow: auto;
  background: transparent;
  color: var(--text);
  resize: none;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

.editor__input:focus { outline: none; }

.editor[data-wrap="off"] .editor__input,
.editor[data-wrap="off"] .editor__highlights {
  white-space: pre;
  overflow-wrap: normal;
}

.editor[data-wrap="off"] .editor__input { overflow-x: auto; }

/* --- status bar --------------------------------------------------------- */
/* One row, always: the save indicator must never be pushed out of sight. The
   counts truncate and the reading time drops out on narrow screens instead. */
.statusbar {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 14px;
  padding: 5px 12px;
  overflow: hidden;
  border-top: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.statusbar > span {
  flex: none;
  white-space: nowrap;
}

.statusbar #status-counts {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.statusbar__spacer { flex: 1 1 auto; min-width: 4px; }

@media (max-width: 860px) {
  #status-reading { display: none !important; }
}

.statusbar__save[data-state="unsaved"] { color: var(--accent); }
.statusbar__save[data-state="error"] { color: var(--danger); }

/* --- banner ------------------------------------------------------------- */
.banner {
  padding: 7px 12px;
  background: var(--warn-bg);
  color: var(--warn-text);
  font-size: 12.5px;
  text-align: center;
}

/* --- toast -------------------------------------------------------------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 38px;
  z-index: 60;
  max-width: min(440px, 90vw);
  padding: 9px 14px;
  transform: translate(-50%, 14px);
  border-radius: 999px;
  background: var(--text);
  color: var(--bg-raised);
  box-shadow: var(--shadow);
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.16s ease, transform 0.16s ease;
  pointer-events: none;
}

.toast[data-visible="true"] {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* --- dialogs ------------------------------------------------------------ */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(0, 0, 0, 0.38);
}

.dialog {
  width: min(560px, 100%);
  max-height: min(86vh, 760px);
  overflow: auto;
  padding: 18px 20px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-raised);
  box-shadow: var(--shadow);
}

.dialog__title {
  margin: 0 0 4px;
  font-size: 16px;
}

.dialog__body {
  margin: 10px 0 0;
  color: var(--text-muted);
  font-size: 13.5px;
}

.dialog__actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

.form-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 12px;
}

.form-row > label {
  flex: none;
  font-size: 13.5px;
}

.form-row > :not(label) { flex: 0 1 220px; }


.form-hint {
  margin: 4px 0 0;
  color: var(--text-faint);
  font-size: 12px;
}

.shortcut-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 2px 22px;
  margin: 6px 0 0;
}

.shortcut-grid h3 {
  grid-column: 1 / -1;
  margin: 14px 0 2px;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.shortcut {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 3px 0;
  font-size: 13px;
}

.shortcut > :first-child {
  min-width: 0;
}

/* Key chips stay on one line; the description wraps instead. */
.shortcut__keys {
  flex: none;
  white-space: nowrap;
}

kbd {
  padding: 1px 5px;
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--bg-sunken);
  font: 11.5px var(--editor-font);
  white-space: nowrap;
}

.menu {
  position: absolute;
  z-index: 40;
  min-width: 228px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 5px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-raised);
  box-shadow: var(--shadow);
}

.menu__item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  padding: 6px 8px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
}

.menu__item:hover:not(:disabled) { background: var(--bg-hover); }
.menu__item:disabled { opacity: 0.45; cursor: default; }

.menu__item span { color: var(--text-faint); font-size: 11.5px; }

.menu__sep {
  height: 1px;
  margin: 5px 6px;
  background: var(--border);
}

.menu__label {
  padding: 6px 8px 2px;
  color: var(--text-faint);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* --- responsive --------------------------------------------------------- */
@media (max-width: 720px) {
  :root { --sidebar-width: 100%; }

  .app { grid-template-columns: 1fr; }

  .app[data-sidebar="visible"] .main { display: none; }
  .app[data-sidebar="visible"] { grid-template-columns: 1fr; }
  .app[data-sidebar="hidden"] { grid-template-columns: 1fr; }

  .toolbar { flex-wrap: wrap; row-gap: 6px; }
  .title-field { max-width: none; }
  .findbar__input { width: 120px; }
  .statusbar { gap: 10px; }
}

/* Below this width the title has nowhere to go, so give it its own row. */
@media (max-width: 520px) {
  .title-field {
    order: 2;
    flex: 1 1 100%;
    border-color: var(--border);
  }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* --- print -------------------------------------------------------------- */
@media print {
  body { overflow: visible; background: #fff; color: #000; }

  .sidebar, .toolbar, .findbar, .statusbar, .banner, .toast, .overlay, .menu,
  .editor__gutter {
    display: none !important;
  }

  .app, .main, .editor, .editor__scroll { display: block; height: auto; overflow: visible; }

  .editor__input {
    position: static;
    height: auto;
    padding: 0;
    overflow: visible;
    color: #000;
    font-size: 11pt;
  }

  .print-title {
    display: block !important;
    margin: 0 0 10pt;
    font: 600 14pt var(--ui-font);
  }
}

.print-title { display: none; }
</style>
</head>
<body>

<!-- =======================================================================
     Markup. Elements the UI script talks to carry an id; everything the
     toolbar/menus trigger is declared with data-action so behaviour lives in
     one dispatch table (see ACTIONS in the notepad-ui script).
     ======================================================================= -->
<div class="app" id="app" data-sidebar="visible">

  <aside class="sidebar" id="sidebar" aria-label="Notes">
    <div class="sidebar__head">
      <h1 class="sidebar__title">Notepad</h1>
      <button class="btn btn--icon btn--quiet" id="sidebar-hide" data-action="toggle-sidebar"
              title="Hide the note list (Ctrl+B)" aria-label="Hide note list">&#9776;</button>
    </div>

    <div class="sidebar__search">
      <input class="field" id="note-search" type="search" placeholder="Search notes"
             aria-label="Search notes" autocomplete="off" spellcheck="false">
    </div>

    <div class="sidebar__tools">
      <label for="sort-mode">Sort</label>
      <select class="field select" id="sort-mode" aria-label="Sort notes by">
        <option value="updated">Last edited</option>
        <option value="created">Date created</option>
        <option value="title">Title</option>
      </select>
    </div>

    <ul class="note-list" id="note-list" aria-label="Saved notes"></ul>

    <div class="sidebar__foot">
      <button class="btn btn--primary" id="new-note" data-action="new-note"
              title="New note (Ctrl+Alt+N)">+ New note</button>
      <div class="toolbar__spacer"></div>
      <button class="btn btn--icon btn--quiet" id="settings-open" data-action="open-settings"
              title="Settings" aria-label="Settings">&#9881;</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="banner" id="storage-banner" hidden role="status"></div>

    <div class="toolbar" role="toolbar" aria-label="Editor actions">
      <button class="btn btn--icon btn--quiet" id="sidebar-show" data-action="toggle-sidebar"
              title="Show the note list (Ctrl+B)" aria-label="Show note list">&#9776;</button>

      <input class="title-field" id="note-title" aria-label="Note title"
             placeholder="Untitled" autocomplete="off" spellcheck="false">

      <div class="toolbar__spacer"></div>

      <div class="toolbar__group">
        <button class="btn btn--icon btn--quiet" id="undo" data-action="undo"
                title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
        <button class="btn btn--icon btn--quiet" id="redo" data-action="redo"
                title="Redo (Ctrl+Y)" aria-label="Redo">&#8631;</button>
      </div>

      <div class="toolbar__sep"></div>

      <div class="toolbar__group">
        <button class="btn btn--quiet" id="find-open" data-action="open-find"
                title="Find and replace (Ctrl+F)">Find</button>
        <button class="btn btn--quiet" id="tools-open" data-action="open-tools-menu"
                aria-haspopup="menu" aria-expanded="false" title="Text tools">Tools</button>
        <button class="btn btn--quiet" id="file-open" data-action="open-file-menu"
                aria-haspopup="menu" aria-expanded="false" title="Import, export and print">File</button>
      </div>
    </div>

    <div class="findbar" id="findbar" hidden role="search" aria-label="Find and replace">
      <input class="field findbar__input" id="find-input" type="text" placeholder="Find"
             aria-label="Find" autocomplete="off" spellcheck="false">
      <button class="btn btn--icon" id="find-prev" data-action="find-prev"
              title="Previous match (Shift+Enter)" aria-label="Previous match">&#8593;</button>
      <button class="btn btn--icon" id="find-next" data-action="find-next"
              title="Next match (Enter)" aria-label="Next match">&#8595;</button>

      <button class="btn" id="replace-all" data-action="replace-all" title="Replace every match">All</button>

        <button class="toggle" id="find-word" data-action="toggle-find-word" aria-pressed="false"

      <div class="editor__scroll" id="editor-scroll">

  </main>
</div>

<script id="notepad-core">
/* ==========================================================================
   NotepadCore — pure logic, zero DOM access.
   --------------------------------------------------------------------------
   Everything in this block is a pure function or a self-contained factory so
   it can be unit tested in Node (see tests/helpers/app.mjs, which evaluates
   this exact script in a bare `vm` context — there is no `document` there, so
   any DOM access would throw immediately).

(function (global) {
  'use strict';

  /** Clamp `n` into [min, max], mapping non-numbers to `fallback`. */

  /* text — measuring and addressing the document                          */
  /* ===================================================================== */

        .split(/\n[ \t]*\n/)
        .filter(function (block) { return /\S/.test(block); });

        // Count by code point so an emoji reads as one character.
        characters: Array.from(str).length,
        charactersNoSpaces: Array.from(str.replace(/\s/g, '')).length,

    },

    /** Number of lines (an empty document still has one line). */
    lineCount: function (value) {

    },

    /**
     * 1-based caret coordinates for a character offset.
     * @returns {{line:number, column:number}}

    caretPosition: function (value, index) {

    },

    /**
     * Character range of a 1-based line number, excluding its line break.
     * Out-of-range numbers clamp to the first/last line.

    lineRange: function (value, lineNumber) {
      var str = String(value == null ? '' : value);
      var lines = str.split('\n');

      var start = 0;

     * on a line break is not extended into the following line.

    expandToLines: function (value, start, end) {

      var from = clamp(start, 0, str.length, 0);
      var to = clamp(end, 0, str.length, 0);
      if (from > to) { var swap = from; from = to; to = swap; }
      var lineStart = str.lastIndexOf('\n', from - 1) + 1;
      var lineEnd = str.indexOf('\n', to);

    },

    /** Whole minutes of reading time for a word count. */

  };

  /* ===================================================================== */
  /* search — find and replace                                             */
  /* ===================================================================== */

  /* Matching stops here so a pathological pattern cannot freeze the tab. */
  var MATCH_LIMIT = 5000;

  var search = {
    MATCH_LIMIT: MATCH_LIMIT,

    /**
     * Turn find options into a global RegExp.
     * @param {{query:string, caseSensitive?:boolean, wholeWord?:boolean,

    compileQuery: function (options) {

      } catch (err) {

    /**

     * @returns {Array<{start:number, end:number, text:string, groups:string[]}>}
     */
    findMatches: function (value, options) {

      var compiled = search.compileQuery(options);
      if (!compiled.ok) return [];

      var regex = compiled.regex;
      var matches = [];
      var match;
      regex.lastIndex = 0;
      while ((match = regex.exec(str)) !== null) {
        matches.push({
          start: match.index,
          end: match.index + match[0].length,
          text: match[0],
          groups: Array.prototype.slice.call(match, 1).map(function (group) {

    },

    /**

     * to a caret offset, wrapping around the document. -1 when there are none.
     */
    nextMatchIndex: function (matches, caret, direction) {
      if (!matches || matches.length === 0) return -1;
      var at = typeof caret === 'number' ? caret : 0;
      var i;
      if (direction < 0) {
        for (i = matches.length - 1; i >= 0; i -= 1) {
          if (matches[i].end <= at) return i;
        }
        return matches.length - 1;
      }
      for (i = 0; i < matches.length; i += 1) {

      }

    },

    /** Index of the match exactly covered by a selection, else -1. */
    activeMatchIndex: function (matches, start, end) {
      if (!matches) return -1;
      for (var i = 0; i < matches.length; i += 1) {

    },

    /**

      return value.replace(/\$(\$|&|\d)/g, function (whole, token) {

  /* ===================================================================== */
  /* edit — selection-aware text transforms                                */
  /* ===================================================================== */
  /*
   * Every operation is a pure function of (value, selection, options) and
   * returns { text, selection }. The UI applies the result to the textarea in
   * one assignment, which keeps undo/redo and the status bar consistent.
   *

   *   nothing is selected;

  /** Normalise and clamp a selection against a value. */
  function selectionOf(str, selection) {

    var end = clamp(sel.end, 0, str.length, start);

    return function (value, selection) {
      var str = String(value == null ? '' : value);
      var sel = selectionOf(str, selection);
      var hasSelection = sel.end > sel.start;
      var from = hasSelection ? sel.start : 0;
      var to = hasSelection ? sel.end : str.length;
      var replaced = fn(str.slice(from, to));
      var out = str.slice(0, from) + replaced + str.slice(to);
      return {
        text: out,
        selection: hasSelection
          ? { start: from, end: from + replaced.length }
          : { start: clamp(sel.start, 0, out.length, 0), end: clamp(sel.end, 0, out.length, 0) },
      };
    };
  }

  /** Build a transform that rewrites whole lines. */

    return function (value, selection, options) {
      var str = String(value == null ? '' : value);

      var opts = options || {};
      var range =

          ? { start: 0, end: str.length }
          : text.expandToLines(str, sel.start, sel.end);
      var lines = str.slice(range.start, range.end).split('\n');
      var out = fn(lines).join('\n');

  function compareLines(a, b) {

    var lb = b.toLowerCase();

      var last = text.caretPosition(str, range.end).line - 1;

      if (delta > 0 && last === lines.length - 1) return unchanged(str, sel);

      var target = first + delta;

      var out = lines.join('\n');

    lowercase: charTransform(function (s) { return s.toLowerCase(); }),

    'sort-desc': lineTransform(function (lines) {

    unique: lineTransform(function (lines) {

    'duplicate-lines': function (value, selection) {
      var str = String(value == null ? '' : value);
      var sel = selectionOf(str, selection);
      var range = text.expandToLines(str, sel.start, sel.end);
      var block = str.slice(range.start, range.end);
      return {
        text: str.slice(0, range.end) + '\n' + block + str.slice(range.end),
        selection: { start: range.end + 1, end: range.end + 1 + block.length },

    },

    'delete-lines': function (value, selection) {
      var str = String(value == null ? '' : value);
      var sel = selectionOf(str, selection);
      var range = text.expandToLines(str, sel.start, sel.end);
      var end = str.charAt(range.end) === '\n' ? range.end + 1 : range.end;

    },

    'move-down': moveLines(1),

    indent: function (value, selection, options) {
      return edit.indent(value, selection, options);
    },
    outdent: function (value, selection, options) {

    },

  var edit = {
    TRANSFORM_NAMES: Object.keys(TRANSFORMS),

    /**
     * Run a named transform.
     * @returns {{text:string, selection:{start:number,end:number}}|null} null

     */
    apply: function (name, value, selection, options) {
      var fn = Object.prototype.hasOwnProperty.call(TRANSFORMS, name) ? TRANSFORMS[name] : null;
      return fn ? fn(value, selection, options) : null;
    },

    /** Replace the selection with `snippet`, caret after it. */
    insert: function (value, selection, snippet) {
      var str = String(value == null ? '' : value);
      var sel = selectionOf(str, selection);
      var inserted = String(snippet == null ? '' : snippet);
      var caret = sel.start + inserted.length;
      return {
        text: str.slice(0, sel.start) + inserted + str.slice(sel.end),
        selection: { start: caret, end: caret },

    },

    /** Insert a line break that keeps the current line's indentation. */
    newlineIndent: function (value, selection) {
      var str = String(value == null ? '' : value);
      var sel = selectionOf(str, selection);
      var lineStart = str.lastIndexOf('\n', sel.start - 1) + 1;
      var pad = /^[ \t]*/.exec(str.slice(lineStart, sel.start))[0];
      return edit.insert(str, sel, '\n' + pad);
    },

    /**
     * Tab behaviour: a selection spanning lines indents each of them, anything
     * else inserts a single indent unit.

    indent: function (value, selection, options) {
      var str = String(value == null ? '' : value);
      var sel = selectionOf(str, selection);
      var unit = indentUnit(options);
      if (str.slice(sel.start, sel.end).indexOf('\n') === -1) {
        return edit.insert(str, sel, unit);

      var range = text.expandToLines(str, sel.start, sel.end);
      var out = str
        .slice(range.start, range.end)
        .split('\n')
        .map(function (line) { return line === '' ? line : unit + line; })
        .join('\n');
      return {
        text: str.slice(0, range.start) + out + str.slice(range.end),

    },

    outdent: function (value, selection, options) {
      var str = String(value == null ? '' : value);
      var sel = selectionOf(str, selection);
      var size = (options || {}).useTabs ? 1 : clamp((options || {}).tabSize, 1, 8, 4);
      var range = text.expandToLines(str, sel.start, sel.end);
      var removedBeforeCaret = 0;
      var offset = range.start;
      var out = str
        .slice(range.start, range.end)
        .split('\n')
        .map(function (line) {
          var removed = 0;
          if (line.charAt(0) === '\t') {
            removed = 1;
          } else {
            while (removed < size && line.charAt(removed) === ' ') removed += 1;
          }
          if (offset + removed <= sel.start) removedBeforeCaret += removed;
          offset += line.length + 1;
          return line.slice(removed);
        })
        .join('\n');

      var collapsed = sel.start === sel.end;
      var caret = clamp(sel.start - removedBeforeCaret, range.start, str.length, range.start);
      return {
        text: str.slice(0, range.start) + out + str.slice(range.end),
        selection: collapsed
          ? { start: caret, end: caret }
          : { start: range.start, end: range.start + out.length },
      };
    },
  };

  /* ===================================================================== */
  /* history — undo / redo                                                 */
  /* ===================================================================== */
  /*
   * The editor rewrites textarea.value wholesale (transforms, replace-all,
   * note switching), which breaks the browser's native undo stack. So the app
   * keeps its own: a linear list of snapshots with an index, where a snapshot
   * is { text, start, end }.
   *
   * Consecutive typing is coalesced into a single step so one Ctrl+Z does not
   * undo one keystroke.
   */

  function copySnapshot(snapshot) {
    var s = snapshot || {};
    var value = String(s.text == null ? '' : s.text);
    var start = clamp(s.start, 0, value.length, value.length);

      text: value,
      start: start,
      end: clamp(s.end, 0, value.length, start),
    };
  }

  var history = {
    DEFAULT_LIMIT: 300,
    DEFAULT_COALESCE_MS: 600,

    create: function (options) {

        opts.coalesceMs === undefined
          ? history.DEFAULT_COALESCE_MS
          : clamp(opts.coalesceMs, 0, 60000, history.DEFAULT_COALESCE_MS);

      var entries = [copySnapshot({ text: '' })];
      var index = 0;
      var lastKind = null;
      var lastAt = -Infinity;

      return {
        /** Replace the baseline (new note opened, file imported, …). */
        reset: function (snapshot) {
          entries = [copySnapshot(snapshot)];
          index = 0;
          lastKind = null;
          lastAt = -Infinity;
        },

         * Remember a state.

        record: function (snapshot, meta) {

          var at = typeof info.at === 'number' ? info.at : 0;

        added: prepared.length,
      };
    },

    /** Lowercase, punctuation-free file stem. */
    slug: function (value) {
      var base = String(value == null ? '' : value)
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9._-]+/g, '-')
        .replace(/-{2,}/g, '-')
        .replace(/^[-._]+/, '')
        .replace(/[-._]+$/, '')
        .slice(0, 80)
        .replace(/[-._]+$/, '');
      return base || 'untitled';
    },

    /** File name for a single exported note. */
    noteFilename: function (note, extension) {
      return backup.slug(notes.displayTitle(note)) + '.' + (extension || 'txt');
    },

    /** File name for a full backup. */
    backupFilename: function (date) {
      return 'notepad-backup-' + (format.date(date) || format.date(Date.now())) + '.json';
    },

    /** Build a note from an imported plain-text file. */
    fromPlainText: function (filename, content, now) {
      var name = String(filename == null ? '' : filename).replace(/\.[^./\\]*$/, '');
      return notes.create({ title: name, body: text.normalizeNewlines(content), now: now });
    },
  };

  /* ===================================================================== */
  /* public namespace                                                      */
  /* ===================================================================== */

  var NotepadCore = {
    version: '1.0.0',
    clamp: clamp,
    escapeRegExp: escapeRegExp,
    text: text,
    search: search,
    edit: edit,
    history: history,
    notes: notes,
    settings: settings,
    storage: storage,
    format: format,
    backup: backup,

  global.NotepadCore = NotepadCore;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<script id="notepad-ui">
/* ==========================================================================
   Notepad UI — everything that touches the DOM.
   --------------------------------------------------------------------------
   Layout of this block:
     1. elements, state
     2. rendering (note list, editor chrome, status bar, match highlights)
     3. editing (apply a core result to the textarea) and note lifecycle
     4. find and replace
     5. files: import, export, print
     6. menus, dialogs, toasts
     7. actions table and keyboard shortcuts
     8. wiring and boot

   Conventions:
     - Nothing is built with innerHTML (bar clearing with ''); all text goes
       through textContent, so note content can never become markup.
     - Everything clickable declares data-action="name"; one delegated listener
       dispatches through ACTIONS, so there is a single list of what the UI
       can do — and the tests can check that list against the markup.
     - Mutations go through NotepadCore and then re-render from state.
   ========================================================================== */
(function () {
  'use strict';

  var Core = window.NotepadCore;
  var text = Core.text;
  var search = Core.search;
  var edit = Core.edit;
  var notes = Core.notes;
  var settingsApi = Core.settings;
  var storage = Core.storage;
  var format = Core.format;
  var backup = Core.backup;

  /* ===================================================================== */
  /* 1. elements and state                                                 */
  /* ===================================================================== */

  /* Object.create(null): a lookup table must never inherit Object.prototype
     keys such as "constructor". */
  var cache = Object.create(null);
  function byId(id) {
    if (!cache[id]) cache[id] = document.getElementById(id);
    return cache[id];
  }

  var input = byId('input');
  var titleField = byId('note-title');
  var noteList = byId('note-list');

  /** Persisted note state. */
  var state = { notes: [], activeId: null };
  /** Persisted preferences. */
  var prefs = settingsApi.defaults();

  /** Session-only UI state. */
  var ui = {
    listQuery: '',
    findOpen: false,
    find: { query: '', replacement: '', caseSensitive: false, wholeWord: false, useRegex: false },
    matches: [],
    matchIndex: -1,
    matchError: '',
    menu: null,
    dialog: null,
    saveTimer: 0,
    listTimer: 0,
    saveState: 'saved',
  };

  /** localStorage access itself can throw in hardened privacy modes. */
  function safeLocalStorage() {
    try {
      return window.localStorage;
    } catch (err) {
      return null;
    }
  }

  var store = storage.createBackend(safeLocalStorage());
  var hist = Core.history.create();

  function activeNote() {
    return notes.get(state, state.activeId);
  }

  function now() {
    return Date.now();
  }

  function selection() {
    return { start: input.selectionStart, end: input.selectionEnd };
  }

  function isNarrow() {
    return Boolean(window.matchMedia && window.matchMedia('(max-width: 720px)').matches);
  }

  /* Counting words is O(document); memoise so repeated renders stay cheap. */
  var statsCache = { value: null, stats: null };
  function statsFor(value) {
    if (statsCache.value !== value) {
      statsCache = { value: value, stats: text.stats(value) };
    }
    return statsCache.stats;
  }

  /* Note ids can come from an imported file, so use a prototype-less map. */
  var wordCountCache = Object.create(null);
  function wordCountFor(note) {
    var cached = wordCountCache[note.id];
    if (cached && cached.updatedAt === note.updatedAt) return cached.words;
    var words = text.stats(note.body).words;
    wordCountCache[note.id] = { updatedAt: note.updatedAt, words: words };
    return words;
  }

  /* ===================================================================== */
  /* 2. rendering                                                          */
  /* ===================================================================== */

  function el(tag, className, textContent) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (textContent != null) node.textContent = textContent;
    return node;
  }

  function render() {
    renderList();
    renderTitle();
    renderChrome();
    renderStatus();
    renderHighlights();
    renderToolbar();
  }

  /** The sidebar: sorted, filtered, with the search term highlighted. */
  function renderList() {
    var visible = notes.filter(notes.sort(state.notes, prefs.sortMode), ui.listQuery);
    noteList.innerHTML = '';

    if (visible.length === 0) {
      noteList.appendChild(el('li', 'note-list__empty',
        state.notes.length === 0 ? 'No notes yet.' : 'No notes match your search.'));
      return;
    }

    var stamp = now();
    visible.forEach(function (note) {
      var row = el('li', 'note-row');

      var button = el('button', 'note');
      button.type = 'button';
      button.setAttribute('data-action', 'select-note');
      button.setAttribute('data-id', note.id);
      if (note.id === state.activeId) button.setAttribute('aria-current', 'true');

      var head = el('div', 'note__row');
      head.appendChild(el('span', 'note__title', notes.displayTitle(note)));
      if (note.pinned) {
        var pin = el('span', 'note__pin', '●');
        pin.title = 'Pinned';
        head.appendChild(pin);
      }
      button.appendChild(head);

      var meta = el('div', 'note__meta');
      meta.appendChild(el('span', null, format.relative(note.updatedAt, stamp)));
      meta.appendChild(el('span', null, format.plural(wordCountFor(note), 'word')));
      button.appendChild(meta);

      var excerpt = el('div', 'note__preview');
      var snippet = ui.listQuery ? notes.snippet(note.body, ui.listQuery) : null;
      if (snippet) {
        excerpt.appendChild(document.createTextNode(snippet.text.slice(0, snippet.start)));
        excerpt.appendChild(el('mark', null, snippet.text.slice(snippet.start, snippet.end)));
        excerpt.appendChild(document.createTextNode(snippet.text.slice(snippet.end)));
      } else {
        excerpt.textContent = notes.preview(note.body) || 'Empty note';
      }
      button.appendChild(excerpt);
      row.appendChild(button);

      var menuButton = el('button', 'note__menu', '⋯');
      menuButton.type = 'button';
      menuButton.setAttribute('data-action', 'open-note-menu');
      menuButton.setAttribute('data-id', note.id);
      menuButton.setAttribute('aria-haspopup', 'menu');
      menuButton.setAttribute('aria-label', 'Actions for ' + notes.displayTitle(note));
      menuButton.title = 'Note actions';
      row.appendChild(menuButton);

      noteList.appendChild(row);
    });
  }

  /** Typing should not rebuild the sidebar on every keystroke. */
  function scheduleListRender() {
    window.clearTimeout(ui.listTimer);
    ui.listTimer = window.setTimeout(renderList, 300);
  }

  function renderTitle() {
    var note = activeNote();
    if (document.activeElement !== titleField) titleField.value = note ? note.title : '';
    titleField.placeholder = note ? notes.deriveTitle(note.body) || 'Untitled' : 'Untitled';
    titleField.disabled = !note;
    byId('print-title').textContent = note ? notes.displayTitle(note) : '';
    document.title = note ? notes.displayTitle(note) + ' — Notepad' : 'Notepad';
  }

  /** Push preferences into the DOM. */
  function renderChrome() {
    var root = document.documentElement;
    root.setAttribute('data-theme', resolvedTheme());
    root.style.setProperty('--editor-font-size', prefs.fontSize + 'px');
    root.style.setProperty('--editor-font', fontStack(prefs.fontFamily));
    root.style.setProperty('--tab-size', String(prefs.tabSize));

    byId('app').setAttribute('data-sidebar', prefs.sidebar ? 'visible' : 'hidden');
    byId('sidebar-show').hidden = prefs.sidebar;
    byId('editor').setAttribute('data-wrap', prefs.wordWrap ? 'on' : 'off');
    input.setAttribute('wrap', prefs.wordWrap ? 'soft' : 'off');
    input.spellcheck = Boolean(prefs.spellCheck);
    byId('statusbar').hidden = !prefs.statusBar;
    byId('sort-mode').value = prefs.sortMode;

    byId('gutter').hidden = !prefs.lineNumbers;
    if (prefs.lineNumbers) renderGutter();
  }

  function resolvedTheme() {
    if (prefs.theme !== 'system') return prefs.theme;
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    return dark ? 'dark' : 'light';
  }

  function fontStack(family) {
    if (family === 'sans') {
      return 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    }
    if (family === 'serif') return 'ui-serif, Georgia, "Times New Roman", serif';
    return 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
  }

  function renderGutter() {
    var count = text.lineCount(input.value);
    var lines = [];
    for (var i = 1; i <= count; i += 1) lines.push(i);
    byId('gutter-lines').textContent = lines.join('\n');
    syncScroll();
  }

  function renderStatus() {
    var sel = selection();
    var caret = text.caretPosition(input.value, sel.end);
    var stats = statsFor(input.value);

    byId('status-caret').textContent = 'Ln ' + caret.line + ', Col ' + caret.column;

    var selected = byId('status-selection');
    var length = sel.end - sel.start;
    selected.hidden = length === 0;
    if (length > 0) selected.textContent = format.plural(length, 'char') + ' selected';

    byId('status-counts').textContent =
      format.plural(stats.words, 'word') + ', ' +
      format.plural(stats.characters, 'character') + ', ' +
      format.plural(stats.lines, 'line');

    var reading = byId('status-reading');
    var minutes = text.readingTime(stats.words);
    reading.hidden = minutes === 0;
    reading.textContent = '~' + minutes + ' min read';

    renderSaveState();
  }

  var SAVE_LABELS = {
    saved: 'Saved',
    unsaved: 'Saving…',
    error: 'Not saved',
    off: 'Saving unavailable',
  };

  function renderSaveState() {
    var node = byId('status-save');
    node.setAttribute('data-state', ui.saveState);
    node.textContent = SAVE_LABELS[ui.saveState] || '';
  }

  function renderToolbar() {
    byId('undo').disabled = !hist.canUndo();
    byId('redo').disabled = !hist.canRedo();
    byId('find-case').setAttribute('aria-pressed', String(ui.find.caseSensitive));
    byId('find-word').setAttribute('aria-pressed', String(ui.find.wholeWord));
    byId('find-regex').setAttribute('aria-pressed', String(ui.find.useRegex));
  }

  /**
   * Paint the match-highlight layer that sits behind the textarea. Built from
   * text nodes and <mark> elements only — note content is never parsed as HTML.
   */
  function renderHighlights() {
    var layer = byId('highlights');
    layer.innerHTML = '';
    if (!ui.findOpen || ui.matches.length === 0) return;

    var value = input.value;
    var fragment = document.createDocumentFragment();
    var cursor = 0;
    ui.matches.forEach(function (match, index) {
      if (match.start < cursor) return;
      fragment.appendChild(document.createTextNode(value.slice(cursor, match.start)));
      var mark = el('mark', null, value.slice(match.start, match.end));
      if (index === ui.matchIndex) mark.setAttribute('data-current', 'true');
      fragment.appendChild(mark);
      cursor = match.end;
    });
    /* The trailing space keeps a final empty line from collapsing. */
    fragment.appendChild(document.createTextNode(value.slice(cursor) + ' '));
    layer.appendChild(fragment);
    syncScroll();
  }

  /**
   * Keep the layers behind and beside the textarea in step with it: the match
   * highlights scroll with the text, the gutter is translated (its own content
   * is shorter, so scrollTop would clamp), and both are told how much width the
   * textarea is losing to its scrollbar.
   */
  function syncScroll() {
    var layer = byId('highlights');
    byId('editor').style.setProperty(
      '--scrollbar-width', (input.offsetWidth - input.clientWidth) + 'px');
    layer.scrollTop = input.scrollTop;
    layer.scrollLeft = input.scrollLeft;
    if (prefs.lineNumbers) {
      byId('gutter-lines').style.transform = 'translateY(' + -input.scrollTop + 'px)';
    }
  }

  /* ===================================================================== */
  /* 3. editing and note lifecycle                                         */
  /* ===================================================================== */

  /** Persist the textarea into state, record an undo step, schedule a save. */
  function commit(kind) {
    var note = activeNote();
    if (!note) return;
    var value = input.value;
    state = notes.update(state, note.id, { body: value }, now());
    hist.record({ text: value, start: input.selectionStart, end: input.selectionEnd },
      { at: now(), kind: kind || 'edit' });
    markUnsaved();
    renderStatus();
    renderTitle();
    renderToolbar();
    scheduleListRender();
    if (prefs.lineNumbers) renderGutter();
    if (ui.findOpen) updateMatches(true);
  }

  /** Apply a { text, selection } result from the core to the editor. */
  function applyResult(result, kind) {
    if (!result) return false;
    if (result.text === input.value) {
      setSelection(result.selection.start, result.selection.end);
      return false;
    }
    input.value = result.text;
    setSelection(result.selection.start, result.selection.end);
    commit(kind || 'transform');
    return true;
  }

  function setSelection(start, end) {
    input.setSelectionRange(start, end === undefined ? start : end);
    scrollSelectionIntoView();
  }

  /** Keep the caret visible after a programmatic selection change. */
  function scrollSelectionIntoView() {
    var lineHeight = parseFloat(window.getComputedStyle(input).lineHeight) || 20;
    var line = text.caretPosition(input.value, input.selectionEnd).line;
    var top = (line - 1) * lineHeight;
    if (top < input.scrollTop) {
      input.scrollTop = Math.max(0, top - lineHeight);
    } else if (top + lineHeight > input.scrollTop + input.clientHeight) {
      input.scrollTop = top - input.clientHeight + lineHeight * 2;
    }
    syncScroll();
  }

  function runTransform(name) {
    var result = edit.apply(name, input.value, selection(), {
      tabSize: prefs.tabSize,
      useTabs: prefs.useTabs,
      wholeDocument: true,
    });
    if (!result) return;
    input.focus();
    applyResult(result, 'transform');
  }

  function insertSnippet(snippet) {
    input.focus();
    applyResult(edit.insert(input.value, selection(), snippet), 'insert');
  }

  /** Put a history snapshot back on screen (undo/redo). */
  function restore(snapshot) {
    if (!snapshot) return;
    var note = activeNote();
    input.value = snapshot.text;
    input.setSelectionRange(snapshot.start, snapshot.end);
    if (note) state = notes.update(state, note.id, { body: snapshot.text }, now());
    markUnsaved();
    renderStatus();
    renderTitle();
    renderToolbar();
    scrollSelectionIntoView();
    scheduleListRender();
    if (prefs.lineNumbers) renderGutter();
    if (ui.findOpen) updateMatches(true);
  }

  function openNote(id) {
    if (!notes.get(state, id)) return;
    state = notes.setActive(state, id);
    var note = activeNote();
    input.value = note.body;
    hist.reset({ text: note.body, start: 0, end: 0 });
    input.scrollTop = 0;
    input.setSelectionRange(0, 0);
    markUnsaved();
    render();
    /* On a phone the list and the editor share the screen, so opening a note
       has to reveal it. */
    if (isNarrow() && prefs.sidebar) updatePrefs({ sidebar: false });
    if (ui.findOpen) updateMatches();
  }

  function patched(patch) {
    var merged = {};
    settingsApi.KEYS.forEach(function (key) { merged[key] = prefs[key]; });
    Object.keys(patch).forEach(function (key) { merged[key] = patch[key]; });
    return merged;
  }

  function newNote(body) {
    var note = notes.create({ body: body || '', now: now() });
    state = notes.add(state, note);
    openNote(note.id);
    input.focus();
    return note;
  }

  function deleteNote(id) {
    var note = notes.get(state, id);
    if (!note) return;
    var label = notes.displayTitle(note);
    confirmDialog({
      title: 'Delete note',
      message: 'Delete “' + label + '”? This cannot be undone.',
      confirmLabel: 'Delete',
      danger: true,
    }, function () {
      state = notes.remove(state, id);
      if (state.notes.length === 0) state = notes.add(state, notes.create({ now: now() }));
      openNote(state.activeId);
      saveNow();
      toast('Deleted “' + label + '”');
    });
  }

  function duplicateNote(id) {
    var target = id || state.activeId;
    if (!notes.get(state, target)) return;
    state = notes.duplicate(state, target, now());
    openNote(state.activeId);
    saveNow();
    toast('Note duplicated');
  }

  function togglePin(id) {
    var note = notes.get(state, id);
    if (!note) return;
    state = notes.update(state, id, { pinned: !note.pinned }, now());
    saveNow();
    renderList();
    toast(note.pinned ? 'Unpinned' : 'Pinned to top');
  }

  /* --- saving ----------------------------------------------------------- */

  function markUnsaved() {
    if (!store.available) {
      ui.saveState = 'off';
      renderSaveState();
      return;
    }
    ui.saveState = 'unsaved';
    renderSaveState();
    saveSoon();
  }

  function saveSoon() {
    window.clearTimeout(ui.saveTimer);
    ui.saveTimer = window.setTimeout(saveNow, 400);
  }

  function saveNow() {
    window.clearTimeout(ui.saveTimer);
    if (!store.available) {
      ui.saveState = 'off';
      renderSaveState();
      return false;
    }
    var ok = storage.save(store, state, prefs);
    ui.saveState = ok ? 'saved' : 'error';
    renderSaveState();
    if (!ok) showBanner('Changes could not be saved: browser storage is full or blocked.');
    return ok;
  }

  /**
   * Apply a settings patch, enforce the rules between settings, re-render and
   * save.
   */
  function updatePrefs(patch) {
    var merged = patched(patch);
    /*
     * Line numbers and word wrap cannot both be on: the gutter numbers logical
     * lines, and a wrapped line occupies several rows, so the two would drift
     * apart down the page. Turning one on turns the other off.
     */
    if (patch.lineNumbers === true) merged.wordWrap = false;
    else if (patch.wordWrap === true) merged.lineNumbers = false;

    prefs = settingsApi.sanitize(merged);
    renderChrome();
    renderList();
    renderStatus();
    syncSettingsControls();
    saveNow();
  }

  /** Keep an open settings dialog in step with values the app adjusted. */
  function syncSettingsControls() {
    if (!ui.dialog) return;
    settingsApi.KEYS.forEach(function (key) {
      var node = document.getElementById('setting-' + key);
      if (!node) return;
      if (node.type === 'checkbox') node.checked = Boolean(prefs[key]);
      else node.value = String(prefs[key]);
    });
  }

  function showBanner(message) {
    var banner = byId('storage-banner');
    banner.textContent = message;
    banner.hidden = false;
  }

  /**
   * Another tab of this app saved something. Without this, two open tabs
   * would overwrite each other's notes in silence.
   *
   * An idle tab adopts the newer state. A tab with edits of its own keeps
   * them and says so, because quietly replacing what someone is typing would
   * be worse than being briefly out of date.
   */
  function adoptExternalChanges() {
    if (!store.available) return;
    if (ui.saveState === 'unsaved') {
      showBanner('These notes were also changed in another tab. Your unsaved changes ' +
        'are still here; reload the page to see the other version.');
      return;
    }

    var loaded = storage.load(store, now());
    var keepId = state.activeId;
    state = loaded.state;
    prefs = loaded.settings;
    if (notes.get(state, keepId)) state = notes.setActive(state, keepId);

    var note = activeNote();
    var caret = selection();
    input.value = note ? note.body : '';
    input.setSelectionRange(
      Math.min(caret.start, input.value.length),
      Math.min(caret.end, input.value.length));
    hist.reset({ text: input.value, start: input.selectionStart, end: input.selectionEnd });
    render();
    if (ui.findOpen) updateMatches();
  }

  /* ===================================================================== */
  /* 4. find and replace                                                   */
  /* ===================================================================== */

  function findOptions() {
    return {
      query: ui.find.query,
      caseSensitive: ui.find.caseSensitive,
      wholeWord: ui.find.wholeWord,
      useRegex: ui.find.useRegex,
    };
  }

  /** Recompute matches. `keepIndex` keeps the current match highlighted. */
  function updateMatches(keepIndex) {
    var options = findOptions();
    var compiled = search.compileQuery(options);
    ui.matchError = ui.find.query && !compiled.ok ? compiled.error : '';
    ui.matches = ui.find.query ? search.findMatches(input.value, options) : [];

    if (!keepIndex) {
      ui.matchIndex = search.activeMatchIndex(ui.matches, input.selectionStart, input.selectionEnd);
    }
    if (ui.matchIndex >= ui.matches.length) ui.matchIndex = -1;

    renderFindStatus();
    renderHighlights();
  }

  function renderFindStatus() {
    var label = byId('find-count');
    var field = byId('find-input');
    field.classList.toggle('findbar__input--invalid', Boolean(ui.matchError));
    field.setAttribute('aria-invalid', ui.matchError ? 'true' : 'false');

    if (ui.matchError) {
      label.textContent = 'Invalid pattern';
    } else if (!ui.find.query) {
      label.textContent = '';
    } else if (ui.matches.length === 0) {
      label.textContent = 'No results';
    } else {
      var total = format.number(ui.matches.length) +
        (ui.matches.length >= search.MATCH_LIMIT ? '+' : '');
      label.textContent = ui.matchIndex >= 0
        ? (ui.matchIndex + 1) + ' of ' + total
        : total + ' matches';
    }
  }

  function openFind(focusReplace) {
    ui.findOpen = true;
    byId('findbar').hidden = false;

    var sel = selection();
    var selected = input.value.slice(sel.start, sel.end);
    if (selected && selected.length < 120 && selected.indexOf('\n') === -1) {
      ui.find.query = selected;
      byId('find-input').value = selected;
    }

    updateMatches();
    var field = byId(focusReplace ? 'replace-input' : 'find-input');
    field.focus();
    field.select();
  }

  function closeFind() {
    ui.findOpen = false;
    byId('findbar').hidden = true;
    ui.matches = [];
    ui.matchIndex = -1;
    renderHighlights();
    input.focus();
  }

  function findStep(direction) {
    if (!ui.find.query) {
      openFind(false);
      return;
    }
    updateMatches(true);
    if (ui.matches.length === 0) {
      toast(ui.matchError ? 'Invalid search pattern' : 'No matches');
      return;
    }
    var caret = direction > 0 ? input.selectionEnd : input.selectionStart;
    ui.matchIndex = search.nextMatchIndex(ui.matches, caret, direction);
    var match = ui.matches[ui.matchIndex];
    /*
     * Do not steal focus from the find bar: pressing Enter repeatedly has to
     * keep walking matches. The highlight layer shows which match is current,
     * so the selection stays visible even while the textarea is unfocused.
     */
    if (!byId('findbar').contains(document.activeElement)) input.focus();
    setSelection(match.start, match.end);
    renderFindStatus();
    renderHighlights();
    renderStatus();
  }

  /**
   * Replace the current match, or the next one if no match is selected yet, so
   * that pressing Replace always does something when there are matches.
   */
  function replaceCurrent() {
    if (!ui.find.query) return;
    updateMatches(true);
    if (ui.matches.length === 0) {
      toast(ui.matchError ? 'Invalid search pattern' : 'No matches to replace');
      return;
    }
    var index = search.activeMatchIndex(ui.matches, input.selectionStart, input.selectionEnd);
    if (index === -1) index = search.nextMatchIndex(ui.matches, input.selectionEnd, 1);

    var result = search.replaceMatch(input.value, ui.matches[index], ui.find.replacement,
      ui.find.useRegex);
    input.value = result.text;
    setSelection(result.selection.end, result.selection.end);
    commit('replace');
    findStep(1);
  }

  function replaceAll() {
    if (!ui.find.query) return;
    var options = findOptions();
    options.replacement = ui.find.replacement;
    var result = search.replaceAll(input.value, options);
    if (result.count === 0) {
      toast(ui.matchError ? 'Invalid search pattern' : 'No matches to replace');
      return;
    }
    var caret = Math.min(input.selectionStart, result.text.length);
    if (!byId('findbar').contains(document.activeElement)) input.focus();
    input.value = result.text;
    setSelection(caret, caret);
    commit('replace-all');
    updateMatches();
    toast('Replaced ' + format.plural(result.count, 'match', 'matches'));
  }

  /* ===================================================================== */
  /* 5. files                                                              */
  /* ===================================================================== */

  function download(filename, content, mime) {
    var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.rel = 'noopener';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function exportNote(extension) {
    var note = activeNote();
    if (!note) return;
    var filename = backup.noteFilename(note, extension);
    download(filename, note.body);
    toast('Exported ' + filename);
  }

  function exportAll() {
    var data = backup.create(state, prefs, now());
    download(backup.backupFilename(new Date()), JSON.stringify(data, null, 2),
      'application/json');
    toast('Exported ' + format.plural(state.notes.length, 'note'));
  }

  /** Import .txt-like files as notes and .json files as backups. */
  function importFiles(files) {
    var list = Array.prototype.slice.call(files || []);
    if (list.length === 0) return;

    var pending = list.length;
    var imported = 0;
    var failures = [];

    function finish() {
      pending -= 1;
      if (pending > 0) return;
      if (imported > 0) {
        openNote(state.activeId);
        saveNow();
      }
      render();
      if (failures.length > 0) toast(failures[0], 5000);
      else toast('Imported ' + format.plural(imported, 'note'));
    }

    list.forEach(function (file) {
      var reader = new FileReader();
      reader.onerror = function () {
        failures.push('Could not read ' + file.name);
        finish();
      };
      reader.onload = function () {
        var content = String(reader.result == null ? '' : reader.result);
        if (/\.json$/i.test(file.name)) {
          var parsed = backup.parse(content, now());
          if (parsed.ok) {
            var merged = backup.merge(state, parsed.notes, now());
            state = merged.state;
            imported += merged.added;
            if (parsed.settings) prefs = parsed.settings;
          } else {
            failures.push(file.name + ': ' + parsed.error);
          }
        } else {
          state = notes.add(state, backup.fromPlainText(file.name, content, now()));
          imported += 1;
        }
        finish();
      };
      reader.readAsText(file);
    });
  }

  function printNote() {
    renderTitle();
    window.print();
  }

  /* ===================================================================== */
  /* 6. menus, dialogs, toasts                                             */
  /* ===================================================================== */

  function toast(message, duration) {
    var node = byId('toast');
    node.textContent = message;
    node.setAttribute('data-visible', 'true');
    window.clearTimeout(toast.timer);
    toast.timer = window.setTimeout(function () {
      node.setAttribute('data-visible', 'false');
    }, duration || 2200);
  }

  function closeMenu() {
    if (!ui.menu) return;
    if (ui.menu.anchor) ui.menu.anchor.setAttribute('aria-expanded', 'false');
    if (ui.menu.node.parentNode) ui.menu.node.parentNode.removeChild(ui.menu.node);
    ui.menu = null;
  }

  /**
   * Open a popup menu anchored to an element.
   * @param {Element} anchor
   * @param {Array<{label?:string, action?:string, run?:Function, shortcut?:string,
   *                disabled?:boolean, separator?:boolean, heading?:string,
   *                checked?:boolean}>} items
   */
  function openMenu(anchor, items) {
    var reopening = Boolean(ui.menu) && ui.menu.anchor === anchor;
    closeMenu();
    if (reopening || items.length === 0) return;

    var node = el('div', 'menu');
    node.setAttribute('role', 'menu');

    items.forEach(function (item) {
      if (item.separator) {
        node.appendChild(el('div', 'menu__sep'));
        return;
      }
      if (item.heading) {
        node.appendChild(el('div', 'menu__label', item.heading));
        return;
      }
      var button = el('button', 'menu__item');
      button.type = 'button';
      button.setAttribute('role', 'menuitem');
      if (item.action) button.setAttribute('data-menu-action', item.action);
      button.appendChild(document.createTextNode((item.checked ? '✓ ' : '') + item.label));
      if (item.shortcut) button.appendChild(el('span', null, item.shortcut));
      if (item.disabled) button.disabled = true;
      button.addEventListener('click', function () {
        closeMenu();
        if (item.run) item.run();
        else if (item.action) runAction(item.action, null);
      });
      node.appendChild(button);
    });

    document.body.appendChild(node);

    /*
     * Place the menu beside its anchor without ever covering it: pick the side
     * with more room and cap the height to that space (the menu scrolls if it
     * still does not fit). A menu drawn over its own button would swallow the
     * click that should close it.
     */
    var box = anchor.getBoundingClientRect();
    var gap = 4;
    var margin = 8;
    var spaceBelow = window.innerHeight - box.bottom - gap - margin;
    var spaceAbove = box.top - gap - margin;
    var openBelow = node.offsetHeight <= spaceBelow || spaceBelow >= spaceAbove;
    var room = Math.max(120, openBelow ? spaceBelow : spaceAbove);

    node.style.maxHeight = room + 'px';
    var height = Math.min(node.offsetHeight, room);
    node.style.top = (openBelow ? box.bottom + gap : Math.max(margin, box.top - height - gap)) + 'px';

    var left = Math.min(box.left, window.innerWidth - node.offsetWidth - margin);
    node.style.left = Math.max(margin, left) + 'px';

    anchor.setAttribute('aria-expanded', 'true');
    ui.menu = { node: node, anchor: anchor };

    var first = node.querySelector('.menu__item:not(:disabled)');
    if (first) first.focus();
  }

  function menuKeydown(event) {
    if (!ui.menu) return;
    var items = Array.prototype.slice.call(
      ui.menu.node.querySelectorAll('.menu__item:not(:disabled)'));
    var index = items.indexOf(document.activeElement);

    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      var step = event.key === 'ArrowDown' ? 1 : -1;
      var next = items[(index + step + items.length) % items.length];
      if (next) next.focus();
    } else if (event.key === 'Escape' || event.key === 'Tab') {
      event.preventDefault();
      var anchor = ui.menu.anchor;
      closeMenu();
      if (anchor && anchor.focus) anchor.focus();
    }
  }

  function closeDialog() {
    if (!ui.dialog) return;
    var previous = ui.dialog.previousFocus;
    if (ui.dialog.overlay.parentNode) {
      ui.dialog.overlay.parentNode.removeChild(ui.dialog.overlay);
    }
    ui.dialog = null;
    if (previous && previous.focus && document.contains(previous)) previous.focus();
    else input.focus();
  }

  /**
   * Open a modal dialog.
   * @param {{name:string, title:string, build?:Function,
   *          actions?:Array<{label:string, run?:Function, primary?:boolean,
   *          danger?:boolean, keepOpen?:boolean, id?:string}>,
   *          onEnter?:Function}} config
   */
  function openDialog(config) {
    closeDialog();
    closeMenu();

    var overlay = el('div', 'overlay');
    overlay.setAttribute('data-dialog', config.name || 'dialog');

    var dialog = el('div', 'dialog');
    dialog.setAttribute('role', 'dialog');
    dialog.setAttribute('aria-modal', 'true');
    dialog.setAttribute('aria-label', config.title);
    dialog.appendChild(el('h2', 'dialog__title', config.title));

    var body = el('div', 'dialog__body');
    dialog.appendChild(body);
    if (config.build) config.build(body);

    var actions = el('div', 'dialog__actions');
    (config.actions || []).forEach(function (action) {
      var className = 'btn' + (action.primary ? ' btn--primary' : '') +
        (action.danger ? ' btn--danger' : '');
      var button = el('button', className, action.label);
      button.type = 'button';
      if (action.id) button.id = action.id;
      button.addEventListener('click', function () {
        if (action.run && action.run() === false) return;
        if (!action.keepOpen) closeDialog();
      });
      actions.appendChild(button);
    });
    dialog.appendChild(actions);
    overlay.appendChild(dialog);

    overlay.addEventListener('mousedown', function (event) {
      if (event.target === overlay) closeDialog();
    });

    document.body.appendChild(overlay);
    ui.dialog = {
      overlay: overlay,
      node: dialog,
      previousFocus: document.activeElement,
      config: config,
    };

    var focusTarget = dialog.querySelector('input, select, textarea, .btn--primary') ||
      dialog.querySelector('.btn');
    if (focusTarget) {
      focusTarget.focus();
      if (focusTarget.select) focusTarget.select();
    }
  }

  /** Escape, Enter and a Tab focus trap for the open dialog. */
  function dialogKeydown(event) {
    if (!ui.dialog) return;

    if (event.key === 'Escape') {
      event.preventDefault();
      closeDialog();
      return;
    }

    if (event.key === 'Enter' && ui.dialog.config.onEnter &&
        (!event.target || event.target.tagName !== 'TEXTAREA')) {
      event.preventDefault();
      ui.dialog.config.onEnter();
      return;
    }

    if (event.key !== 'Tab') return;
    var focusable = Array.prototype.slice.call(ui.dialog.node.querySelectorAll(
      'button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled)'));
    if (focusable.length === 0) return;
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  function confirmDialog(config, onConfirm) {
    openDialog({
      name: 'confirm',
      title: config.title || 'Are you sure?',
      build: function (body) {
        body.appendChild(el('p', null, config.message || ''));
      },
      onEnter: function () {
        closeDialog();
        onConfirm();
      },
      actions: [
        { label: 'Cancel' },
        {
          label: config.confirmLabel || 'OK',
          primary: !config.danger,
          danger: Boolean(config.danger),
          id: 'dialog-confirm',
          run: onConfirm,
        },
      ],
    });
  }

  function goToLineDialog() {
    var field;
    var lines = text.lineCount(input.value);

    function submit() {
      var target = parseInt(field.value, 10);
      if (!isFinite(target)) return false;
      var range = text.lineRange(input.value, target);
      input.focus();
      setSelection(range.start, range.start);
      renderStatus();
      return true;
    }

    openDialog({
      name: 'goto',
      title: 'Go to line',
      build: function (body) {
        body.appendChild(el('p', null, 'This note has ' + format.plural(lines, 'line') + '.'));
        var row = el('div', 'form-row');
        var label = el('label', null, 'Line number');
        label.setAttribute('for', 'goto-line');
        field = el('input', 'field');
        field.id = 'goto-line';
        field.type = 'number';
        field.min = '1';
        field.max = String(lines);
        field.value = String(text.caretPosition(input.value, input.selectionStart).line);
        row.appendChild(label);
        row.appendChild(field);
        body.appendChild(row);
      },
      onEnter: function () {
        if (submit() !== false) closeDialog();
      },
      actions: [{ label: 'Cancel' }, { label: 'Go', primary: true, run: submit }],
    });
  }

  function settingRow(labelText, control) {
    var row = el('div', 'form-row');
    var label = el('label', null, labelText);
    label.setAttribute('for', control.id);
    row.appendChild(label);
    row.appendChild(control);
    return row;
  }

  function selectRow(labelText, key, options) {
    var select = el('select', 'field select');
    select.id = 'setting-' + key;
    options.forEach(function (pair) {
      var option = el('option', null, pair[1]);
      option.value = pair[0];
      if (prefs[key] === pair[0]) option.selected = true;
      select.appendChild(option);
    });
    select.addEventListener('change', function () {
      var patch = {};
      patch[key] = select.value;
      updatePrefs(patch);
    });
    return settingRow(labelText, select);
  }

  function numberRow(labelText, key, min, max) {
    var field = el('input', 'field');
    field.id = 'setting-' + key;
    field.type = 'number';
    field.min = String(min);
    field.max = String(max);
    field.value = String(prefs[key]);
    field.addEventListener('change', function () {
      var patch = {};
      patch[key] = Number(field.value);
      /* updatePrefs writes the clamped value back into this field. */
      updatePrefs(patch);
    });
    return settingRow(labelText, field);
  }

  function checkRow(labelText, key) {
    var field = el('input');
    field.id = 'setting-' + key;
    field.type = 'checkbox';
    field.checked = Boolean(prefs[key]);
    field.addEventListener('change', function () {
      var patch = {};
      patch[key] = field.checked;
      updatePrefs(patch);
    });
    return settingRow(labelText, field);
  }
