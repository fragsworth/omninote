<!doctype html>
<html lang="en" data-sidebar="open">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Notepad — a fast, private, offline notepad. Your notes stay in this browser."
    />
    <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)" />

    <!-- Inline so the page still asks the network for nothing at all. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6e62'/%3E%3Cg stroke='%23fdfdfb' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M9 11h14M9 16h14M9 21h8'/%3E%3C/g%3E%3C/svg%3E"
    />

    <title>Notepad</title>

    <style>
      /* ================================================================== *
       * Design tokens
       * ================================================================== */
      :root {
        --bg: #f4f3ef;
        --surface: #ffffff;
        --surface-2: #eceae4;
        --surface-3: #e2dfd7;
        --text: #1f1e1c;
        --text-soft: #4c4a45;
        --muted: #76736c;
        --border: #dcd9d1;
        --border-strong: #c6c2b8;
        --accent: #0f6e62;
        --accent-text: #ffffff;
        --accent-soft: #dcefe9;
        --warn: #9a5b12;
        --danger: #a8301f;
        --pin: #b07612;
        --shadow-1: 0 1px 2px rgba(31, 30, 28, 0.06), 0 1px 3px rgba(31, 30, 28, 0.08);
        --shadow-2: 0 10px 30px rgba(31, 30, 28, 0.16), 0 2px 8px rgba(31, 30, 28, 0.1);
        --radius: 10px;
        --radius-sm: 7px;
        --sidebar-w: 270px;
        --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        --font-serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
        --editor-font: var(--font-mono);
        --editor-size: 15px;
        --speed: 140ms;
      }

      /* Dark by system preference, unless the user explicitly chose light.
         Written without CSS nesting so every browser (and jsdom) parses it. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #17181a;
          --surface: #1f2123;
          --surface-2: #272a2d;
          --surface-3: #32363a;
          --text: #e9e8e3;
          --text-soft: #c8c6c0;
          --muted: #95938c;
          --border: #33373b;
          --border-strong: #474c51;
          --accent: #49b3a1;
          --accent-text: #08201c;
          --accent-soft: #1d3b37;
          --warn: #e0a863;
          --danger: #ef8074;
          --pin: #d9a643;
          --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
          --shadow-2: 0 14px 36px rgba(0, 0, 0, 0.5);
        }
      }

      /* Same dark values, applied when the user explicitly picks dark. */
      :root[data-theme="dark"] {
        --bg: #17181a;
        --surface: #1f2123;
        --surface-2: #272a2d;
        --surface-3: #32363a;
        --text: #e9e8e3;
        --text-soft: #c8c6c0;
        --muted: #95938c;
        --border: #33373b;
        --border-strong: #474c51;
        --accent: #49b3a1;
        --accent-text: #08201c;
        --accent-soft: #1d3b37;
        --warn: #e0a863;
        --danger: #ef8074;
        --pin: #d9a643;
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-2: 0 14px 36px rgba(0, 0, 0, 0.5);
      }

      /* ================================================================== *
       * Reset & base
       * ================================================================== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* The UA rule for [hidden] is only `display: none` at author-sheet-losing
         specificity: any `display` below would override it and the element
         would stay on screen. Everything here toggles with `hidden`, so make it
         win. */
      [hidden] {
        display: none !important;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 var(--font-ui);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }

      ::selection {
        background: color-mix(in srgb, var(--accent) 28%, transparent);
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      /* ================================================================== *
       * Buttons & controls
       * ================================================================== */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 30px;
        padding: 4px 10px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        color: var(--text-soft);
        cursor: pointer;
        white-space: nowrap;
        transition: background var(--speed), color var(--speed), border-color var(--speed);
      }

      .btn:hover {
        background: var(--surface-2);
        color: var(--text);
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn--primary {
        background: var(--accent);
        border-color: transparent;
        color: var(--accent-text);
        font-weight: 600;
      }

      .btn--primary:hover {
        background: color-mix(in srgb, var(--accent) 88%, #000);
        color: var(--accent-text);
      }

      .btn--ghost {
        background: transparent;
        border-color: transparent;
      }

      .btn--ghost:hover {
        background: var(--surface-2);
      }

      .btn--icon {
        width: 30px;
        padding: 0;
        font-size: 15px;
      }

      .btn--danger:hover {
        background: color-mix(in srgb, var(--danger) 14%, transparent);
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 40%, transparent);
      }

      .btn[aria-pressed="true"] {
        background: var(--accent-soft);
        border-color: color-mix(in srgb, var(--accent) 45%, transparent);
        color: var(--text);
      }

      .field {
        width: 100%;
        min-height: 30px;
        padding: 5px 9px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        color: var(--text);
      }

      .field::placeholder {
        color: var(--muted);
      }

      .field[aria-invalid="true"] {
        border-color: var(--danger);
      }

      /* ================================================================== *
       * App shell
       * ================================================================== */
      .app {
        display: grid;
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
        height: 100%;
      }

      html[data-sidebar="closed"] .app {
        grid-template-columns: 0 minmax(0, 1fr);
      }

      html[data-sidebar="closed"] .sidebar {
        display: none;
      }

      /* ---- Sidebar ---------------------------------------------------- */
      .sidebar {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--surface-2);
        border-right: 1px solid var(--border);
      }

      .sidebar__head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 7px;
        margin-right: auto;
        min-width: 0;
      }

      .brand__name {
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .brand__count {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .sidebar__tools {
        display: flex;
        gap: 6px;
        padding: 0 12px 10px;
      }

      .sidebar__tools .field {
        flex: 1 1 auto;
        min-width: 0;
      }

      .sidebar__tools select.field {
        flex: 0 0 auto;
        width: auto;
        cursor: pointer;
      }

      .note-list {
        flex: 1 1 auto;
        margin: 0;
        padding: 0 8px 8px;
        overflow-x: hidden;
        overflow-y: auto;
        list-style: none;
        scrollbar-width: thin;
      }

      .note-item {
        display: block;
        width: 100%;
        margin-bottom: 4px;
        padding: 8px 10px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        text-align: left;
        cursor: pointer;
      }

      .note-item:hover {
        background: color-mix(in srgb, var(--surface) 70%, transparent);
      }

      .note-item[aria-current="true"] {
        background: var(--surface);
        border-color: var(--border-strong);
        box-shadow: var(--shadow-1);
      }

      .note-item__top {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .note-item__title {
        flex: 1 1 auto;
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .note-item__pin {
        color: var(--pin);
        font-size: 11px;
      }

      .note-item__time {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .note-item__snippet {
        display: block; /* inline elements ignore overflow, so the ellipsis needs this */
        margin-top: 2px;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .note-item__snippet:empty::before {
        content: "Empty note";
        font-style: italic;
        opacity: 0.7;
      }

      .list-empty {
        margin: 10px 14px;
        color: var(--muted);
        font-size: 13px;
      }

      .sidebar__foot {
        display: flex;
        gap: 6px;
        padding: 8px 12px;
        border-top: 1px solid var(--border);
      }

      .sidebar__foot .btn {
        flex: 1 1 0;
        font-size: 12px;
      }

      /* ---- Main column ------------------------------------------------ */
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--surface);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--border);
      }

      .toolbar__title {
        flex: 1 1 auto;
        min-width: 0; /* so the toolbar can shrink below the title's ideal width */
        max-width: 460px;
        padding: 4px 8px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
        text-overflow: ellipsis;
      }

      .toolbar__title:hover {
        border-color: var(--border);
      }

      .toolbar__title:focus {
        background: var(--bg);
        border-color: var(--border-strong);
        outline: none;
      }

      .save-state {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        transition: color var(--speed);
      }

      .save-state[data-state="unsaved"] {
        color: var(--warn);
      }

      .save-state[data-state="error"] {
        color: var(--danger);
      }

      .toolbar__actions {
        display: flex;
        gap: 6px;
        margin-left: auto;
      }

      /* ---- Menu ------------------------------------------------------- */
      .menu-anchor {
        position: relative;
      }

      .menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 40;
        width: 300px;
        padding: 6px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        box-shadow: var(--shadow-2);
      }

      .menu__item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 7px 9px;
        background: transparent;
        border: 0;
        border-radius: var(--radius-sm);
        color: var(--text-soft);
        text-align: left;
        cursor: pointer;
      }

      .menu__item:hover,
      .menu__item:focus-visible {
        background: var(--surface-2);
        color: var(--text);
        outline: none;
      }

      .menu__item[aria-checked="true"] .menu__check {
        visibility: visible;
      }

      .menu__check {
        flex: 0 0 12px;
        visibility: hidden;
        color: var(--accent);
        font-size: 12px;
      }

      .menu__label {
        flex: 1 1 auto;
      }

      .menu__value {
        color: var(--muted);
        font-size: 12px;
      }

      .menu__hint {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .menu__sep {
        height: 1px;
        margin: 5px 8px;
        background: var(--border);
      }

      .menu__item--danger {
        color: var(--danger);
      }

      .menu__item--danger:hover {
        background: color-mix(in srgb, var(--danger) 12%, transparent);
        color: var(--danger);
      }

      /* ---- Find bar --------------------------------------------------- */
      .findbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
      }

      .findbar__group {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .findbar__group--grow {
        flex: 1 1 200px;
        min-width: 150px;
      }

      .findbar input.field {
        min-width: 0;
      }

      .findbar__count {
        flex: 0 0 auto;
        min-width: 74px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .findbar__toggle {
        min-width: 30px;
        font-size: 12px;
        font-weight: 600;
      }

      /* ---- Editor ----------------------------------------------------- */
      .editor-wrap {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }

      .editor {
        display: block;
        width: 100%;
        height: 100%;
        padding: 18px clamp(14px, 4vw, 42px) 40px;
        background: transparent;
        border: 0;
        color: var(--text);
        font-family: var(--editor-font);
        font-size: var(--editor-size);
        line-height: 1.65;
        resize: none;
        tab-size: 4;
      }

      .editor:focus {
        outline: none;
      }

      .editor[wrap="off"] {
        overflow-x: auto;
        white-space: pre;
      }

      .editor-wrap.is-dropping::after {
        content: "Drop text files to open";
        position: absolute;
        inset: 10px;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--accent) 10%, var(--surface));
        border: 2px dashed var(--accent);
        border-radius: var(--radius);
        color: var(--accent);
        font-weight: 600;
        pointer-events: none;
      }

      /* ---- Status bar ------------------------------------------------- */
      .statusbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 5px 12px;
        background: var(--surface-2);
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .statusbar__spacer {
        margin-left: auto;
      }

      .statusbar .btn {
        min-height: 22px;
        padding: 0 7px;
        font-size: 11px;
      }

      .zoom {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      /* ---- Dialogs & toast -------------------------------------------- */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(10, 10, 10, 0.38);
      }

      .dialog {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 60;
        width: min(520px, calc(100vw - 32px));
        max-height: min(80vh, 680px);
        padding: 18px;
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        box-shadow: var(--shadow-2);
        transform: translate(-50%, -50%);
      }

      /* The panel takes focus when it opens, so a long sheet starts at the top.
         It is a container, not a control, so it gets no focus ring. */
      .dialog:focus,
      .dialog:focus-visible {
        outline: none;
      }

      .dialog__title {
        margin: 0 0 6px;
        font-size: 16px;
      }

      .dialog__text {
        margin: 0 0 14px;
        color: var(--text-soft);
      }

      .dialog__row {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }

      .shortcut-grid {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 16px;
        margin: 0 0 12px;
        font-size: 13px;
      }

      .shortcut-grid dt {
        color: var(--text-soft);
      }

      .shortcut-grid dd {
        margin: 0;
      }

      kbd {
        display: inline-block;
        padding: 1px 6px;
        background: var(--surface-2);
        border: 1px solid var(--border-strong);
        border-bottom-width: 2px;
        border-radius: 5px;
        font-family: var(--font-ui);
        font-size: 11px;
        white-space: nowrap;
      }

      .dialog h3 {
        margin: 16px 0 8px;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .dialog h3:first-of-type {
        margin-top: 0;
      }

      .toast {
        position: fixed;
        bottom: 22px;
        left: 50%;
        z-index: 70;
        max-width: min(420px, calc(100vw - 32px));
        padding: 9px 16px;
        background: var(--text);
        border-radius: 999px;
        box-shadow: var(--shadow-2);
        color: var(--surface);
        font-size: 13px;
        transform: translateX(-50%);
      }

      .banner {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: color-mix(in srgb, var(--warn) 16%, var(--surface));
        border-bottom: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
        color: var(--text);
        font-size: 13px;
      }

      .banner .btn {
        margin-left: auto;
      }

      /* ---- Print ------------------------------------------------------ */
      .print-area {
        display: none;
      }

      @media print {
        body {
          overflow: visible;
          background: #fff;
          color: #000;
        }

        .app,
        .toast,
        .backdrop,
        .dialog,
        .banner {
          display: none !important;
        }

        .print-area {
          display: block;
          padding: 0;
          font-family: var(--font-serif);
          font-size: 12pt;
        }

        .print-area h1 {
          margin: 0 0 12pt;
          font-size: 16pt;
        }

        .print-area pre {
          margin: 0;
          font-family: var(--font-mono);
          font-size: 10.5pt;
          white-space: pre-wrap;
          word-break: break-word;
        }
      }

      /* ---- Small screens ---------------------------------------------- */
      /* The sidebar becomes a drawer over the editor, with a scrim to dismiss it. */
      .scrim {
        display: none;
      }

      @media (max-width: 720px) {
        .app {
          grid-template-columns: minmax(0, 1fr);
        }

        .sidebar {
          position: fixed;
          top: 0;
          bottom: 0;
          left: 0;
          z-index: 45;
          width: min(86vw, 320px);
          box-shadow: var(--shadow-2);
        }

        html[data-sidebar="open"] .scrim {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 44;
          background: rgba(10, 10, 10, 0.38);
        }

        html[data-sidebar="closed"] .app {
          grid-template-columns: minmax(0, 1fr);
        }

        .toolbar {
          padding: 8px 10px;
        }

        .toolbar__title {
          max-width: none;
        }

        .statusbar__optional {
          display: none;
        }
      }

      @media (max-width: 560px) {
        .save-state {
          display: none; /* the status bar already says when the note was edited */
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0ms !important;
          animation-duration: 0ms !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      <p style="padding: 24px; font: 16px/1.5 system-ui">
        Notepad needs JavaScript to run. It is a single HTML file with no tracking and no network
        calls — enable JavaScript and reload to start writing.
      </p>
    </noscript>

    <div id="storage-banner" class="banner" role="alert" hidden>
      <span id="storage-banner-text"></span>
      <button id="storage-banner-dismiss" class="btn" type="button">Dismiss</button>
    </div>

    <div id="scrim" class="scrim" aria-hidden="true"></div>

    <div class="app">
      <!-- ============================ Sidebar ============================ -->
      <aside id="sidebar" class="sidebar" aria-label="Notes">
        <div class="sidebar__head">
          <div class="brand">
            <span class="brand__name">Notepad</span>
            <span id="note-count" class="brand__count"></span>
          </div>
          <button id="new-note" class="btn btn--primary" type="button" title="New note">
            <span aria-hidden="true">+</span> New
          </button>
        </div>

        <div class="sidebar__tools">
          <label class="sr-only" for="search">Search notes</label>
          <input id="search" class="field" type="search" placeholder="Search notes" autocomplete="off" />
          <label class="sr-only" for="sort-mode">Sort notes</label>
          <select id="sort-mode" class="field" title="Sort notes">
            <option value="updated">Recent</option>
            <option value="created">Created</option>
            <option value="title">Title</option>
          </select>
        </div>

        <ul id="note-list" class="note-list"></ul>
        <p id="note-list-empty" class="list-empty" hidden>No notes match your search.</p>

        <div class="sidebar__foot">
          <button id="export-all" class="btn" type="button">Export all</button>
          <button id="import-notes" class="btn" type="button">Import…</button>
        </div>
      </aside>

      <!-- ============================= Main ============================== -->
      <main class="main">
        <header class="toolbar">
          <button
            id="toggle-sidebar"

    <!-- ================================================================== *
     * Core: pure logic. No DOM, no storage, no timers — so it can be unit
     * tested by lifting this one script out of the page (see
     * test/helpers/harness.mjs). Keep it that way.
     * ================================================================== -->
    <script id="notepad-core">
      'use strict';

      var NotepadCore = (function () {
        /* ---------------------------------------------------------------- *
         * Constants
         * ---------------------------------------------------------------- */
        var STORAGE_KEY = 'notepad:state';
        var SCHEMA_VERSION = 1;
        var FONT_SIZE_RANGE = { min: 11, max: 28, step: 1, default: 15 };
        var TITLE_MAX = 60;
        var UNTITLED = 'Untitled note';
        var THEMES = ['system', 'light', 'dark'];
        var FONT_FAMILIES = ['mono', 'sans', 'serif'];
        var SORT_MODES = ['updated', 'created', 'title'];
        var MONTHS = [
          'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
          'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'
        ];
        var WELCOME_BODY = [
          'Welcome to Notepad',
          '',
          'Everything you type is saved in this browser as you go — no account, no',
          'network, no tracking. Open this file again and your notes are still here.',
          '',
          'A few things worth knowing:',
          '',
          '- "+ New" starts another note; the list on the left keeps them all.',
          '- The title is the first line, or click it in the toolbar to rename.',
          '- Ctrl+F finds and replaces, Ctrl+S saves a .txt copy to your computer.',
          '- Press F1 for the full list of keyboard shortcuts.',
          '- "Export all" writes a JSON backup you can import anywhere.',
          '',
          'Delete this note whenever you like and start writing.'
        ].join('\n');

        /* ---------------------------------------------------------------- *
         * Small utilities
         * ---------------------------------------------------------------- */
        function clamp(value, min, max) {
          return value < min ? min : value > max ? max : value;
        }

        function isObject(value) {
          return typeof value === 'object' && value !== null && !Array.isArray(value);
        }

        function str(value, fallback) {
          return typeof value === 'string' ? value : fallback === undefined ? '' : fallback;
        }

        function normalizeNewlines(text) {
          return String(text).replace(/\r\n?/g, '\n');
        }

        function escapeRegExp(text) {
          return String(text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        var uidCounter = 0;
        function uid() {
          uidCounter += 1;
          return (
            Date.now().toString(36) +
            '-' +
            uidCounter.toString(36) +
            '-' +
            Math.floor(Math.random() * 1e9).toString(36)
          );
        }

        function namedError(name, message) {
          var error = new Error(message);
          error.name = name;
          return error;
        }

        /* ---------------------------------------------------------------- *
         * Text metrics
         * ---------------------------------------------------------------- */
        // Runs on every keystroke, so it counts by matching rather than by
        // building arrays of characters — three times cheaper on a long note.
        function countStats(text) {
          var value = normalizeNewlines(str(text));
          var words = value.match(/\S+/g);
          var spaces = value.match(/\s/g);
          var breaks = value.match(/\n/g);
          // A surrogate pair is two UTF-16 units but one character.
          var pairs = value.match(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g);
          var characters = value.length - (pairs ? pairs.length : 0);
          var blocks = value.split(/(?:\n[ \t]*)+\n/);
          var paragraphs = 0;
          for (var i = 0; i < blocks.length; i += 1) {
            if (/\S/.test(blocks[i])) paragraphs += 1;
          }
          return {
            characters: characters,
            charactersNoSpaces: characters - (spaces ? spaces.length : 0),
            words: words ? words.length : 0,
            lines: (breaks ? breaks.length : 0) + 1,
            paragraphs: paragraphs
          };
        }

        function caretPosition(text, index) {
          var value = normalizeNewlines(str(text));
          var at = clamp(Number(index) || 0, 0, value.length);
          var before = value.slice(0, at);
          var breaks = before.match(/\n/g);
          return {
            line: (breaks ? breaks.length : 0) + 1,
            column: at - before.lastIndexOf('\n')
          };
        }

        function lineStartOf(text, index) {
          var at = clamp(Number(index) || 0, 0, text.length);
          return text.lastIndexOf('\n', at - 1) + 1;
        }

        function lineEndOf(text, index) {
          var at = clamp(Number(index) || 0, 0, text.length);
          var next = text.indexOf('\n', at);
          return next === -1 ? text.length : next;
        }

        function lineRange(text, line) {
          var value = normalizeNewlines(str(text));
          var lines = value.split('\n');
          var wanted = clamp(Math.floor(Number(line) || 1), 1, lines.length);
          var start = 0;
          for (var i = 0; i < wanted - 1; i += 1) start += lines[i].length + 1;
          return { start: start, end: start + lines[wanted - 1].length };
        }

        /* ---------------------------------------------------------------- *
         * Find & replace
         * ---------------------------------------------------------------- */
        function buildPattern(query, options) {
          var opts = options || {};
          var source = opts.useRegex ? String(query) : escapeRegExp(query);
          if (opts.wholeWord) source = '\\b(?:' + source + ')\\b';
          var flags = opts.caseSensitive ? 'g' : 'gi';
          try {
            return new RegExp(source, flags);
          } catch (error) {
            throw namedError('PatternError', error.message);
          }
        }

        function findMatches(text, query, options) {
          if (!query) return [];
          var value = str(text);
          var pattern = buildPattern(query, options);
          var matches = [];
          var match;
          var guard = 0;
          while ((match = pattern.exec(value)) !== null) {
            matches.push({ start: match.index, end: match.index + match[0].length });
            if (match[0].length === 0) pattern.lastIndex += 1;
            guard += 1;
            if (guard > 100000 || pattern.lastIndex > value.length) break;
          }
          return matches;
        }

        function findNextIndex(matches, caret, options) {
          if (!matches || matches.length === 0) return -1;
          var opts = options || {};
          var direction = opts.direction === -1 ? -1 : 1;
          var wrap = opts.wrap !== false;
          var at = Number(caret) || 0;
          var i;
          if (direction === 1) {
            for (i = 0; i < matches.length; i += 1) {
              if (matches[i].start >= at) return i;
            }
            return wrap ? 0 : -1;
          }
          for (i = matches.length - 1; i >= 0; i -= 1) {
            if (matches[i].end <= at) return i;
          }
          return wrap ? matches.length - 1 : -1;
        }

        function replaceRange(text, start, end, insert) {
          var value = str(text);
          var from = clamp(Math.min(start, end), 0, value.length);
          var to = clamp(Math.max(start, end), 0, value.length);
          var added = str(insert);
          return {
            text: value.slice(0, from) + added + value.slice(to),
            caret: from + added.length
          };
        }

        function replaceAll(text, query, replacement, options) {
          var value = str(text);
          if (!query) return { text: value, count: 0 };
          var opts = options || {};
          var pattern = buildPattern(query, opts);
          var count = findMatches(value, query, opts).length;
          if (count === 0) return { text: value, count: 0 };
          var next = opts.useRegex
            ? value.replace(pattern, str(replacement))
            : value.replace(pattern, function () {
                return str(replacement);
              });
          return { text: next, count: count };
        }

        /* ---------------------------------------------------------------- *
         * Editor operations — pure text transforms that also report where
         * the selection should end up.
         * ---------------------------------------------------------------- */
        function selectionResult(text, start, end) {
          return {
            text: text,
            selectionStart: clamp(start, 0, text.length),
            selectionEnd: clamp(end, 0, text.length)
          };
        }

        function affectedLineStarts(text, start, end) {
          var first = lineStartOf(text, start);
          var lastIndex = end;
          if (end > start && lineStartOf(text, end) === end) lastIndex = end - 1;
          var last = lineStartOf(text, lastIndex);
          var starts = [first];
          var cursor = first;
          while (cursor < last) {
            cursor = lineEndOf(text, cursor) + 1;
            starts.push(cursor);
          }
          return starts;
        }

        function indentLines(text, start, end, unit) {
          var value = str(text);
          var indent = unit === undefined ? '  ' : unit;
          var from = Math.min(start, end);
          var to = Math.max(start, end);
          if (from === to) {
            var inserted = replaceRange(value, from, to, indent);
            return selectionResult(inserted.text, inserted.caret, inserted.caret);
          }
          var starts = affectedLineStarts(value, from, to);
          var next = value;
          for (var i = starts.length - 1; i >= 0; i -= 1) {
            next = next.slice(0, starts[i]) + indent + next.slice(starts[i]);
          }
          var startsAtLineStart = starts[0] === from;
          return selectionResult(
            next,
            startsAtLineStart ? from : from + indent.length,
            to + indent.length * starts.length
          );
        }

        function outdentLines(text, start, end, unit) {
          var value = str(text);
          var width = (unit === undefined ? '  ' : unit).length;
          var from = Math.min(start, end);
          var to = Math.max(start, end);
          var starts = affectedLineStarts(value, from, to);
          var next = value;
          var removedTotal = 0;
          var removedFirst = 0;
          for (var i = starts.length - 1; i >= 0; i -= 1) {
            var at = starts[i];
            var remove = 0;
            if (next.charAt(at) === '\t') {
              remove = 1;
            } else {
              while (remove < width && next.charAt(at + remove) === ' ') remove += 1;
            }
            if (remove > 0) {
              next = next.slice(0, at) + next.slice(at + remove);
              removedTotal += remove;
              if (i === 0) removedFirst = remove;
            }
          }
          var newStart = Math.max(starts[0], from - removedFirst);
          return selectionResult(next, newStart, Math.max(newStart, to - removedTotal));
        }

        var LIST_ITEM = /^([ \t]*)([-*+]|\d+[.)])([ \t]+\[[ xX]\])?[ \t]+(.*)$/;

        function pressEnter(text, start, end) {
          var value = str(text);
          var from = Math.min(start, end);
          var to = Math.max(start, end);
          var lineStart = lineStartOf(value, from);
          var prefix = value.slice(lineStart, from);
          var indent = prefix.match(/^[ \t]*/)[0];
          var item = LIST_ITEM.exec(prefix);

          if (item && item[4] === '' && from === to) {
            // Second Enter on an empty list item clears the marker instead of
            // adding another one.
            var cleared = value.slice(0, lineStart) + item[1] + value.slice(from);
            var caret = lineStart + item[1].length;
            return selectionResult(cleared, caret, caret);
          }

          var marker = '';
          if (item) {
            var bullet = item[2];
            if (/^\d/.test(bullet)) {
              var number = parseInt(bullet, 10) + 1;
              marker = number + bullet.replace(/^\d+/, '') + ' ';
            } else {
              marker = bullet + ' ';
            }
            if (item[3]) marker += '[ ] ';
          }
          var result = replaceRange(value, from, to, '\n' + indent + marker);
          return selectionResult(result.text, result.caret, result.caret);
        }

        function duplicateLines(text, start, end) {
          var value = str(text);
          var from = Math.min(start, end);
          var to = Math.max(start, end);
          var blockStart = lineStartOf(value, from);
          var blockEnd = lineEndOf(value, to);
          var block = value.slice(blockStart, blockEnd);
          var next = value.slice(0, blockEnd) + '\n' + block + value.slice(blockEnd);
          var shift = block.length + 1;
          return selectionResult(next, from + shift, to + shift);
        }

        function deleteLines(text, start, end) {
          var value = str(text);
          var from = Math.min(start, end);
          var to = Math.max(start, end);
          var cutStart = lineStartOf(value, from);
          var cutEnd = lineEndOf(value, to);
          if (cutEnd < value.length) {
            cutEnd += 1;
          } else if (cutStart > 0) {
            cutStart -= 1;
          }
          var next = value.slice(0, cutStart) + value.slice(cutEnd);
          var caret = Math.min(cutStart, next.length);
          return selectionResult(next, caret, caret);
        }

        function moveLines(text, start, end, delta) {
          var value = str(text);
          var from = Math.min(start, end);
          var to = Math.max(start, end);
          var step = delta < 0 ? -1 : 1;
          var lines = value.split('\n');
          var starts = affectedLineStarts(value, from, to);
          var firstLine = caretPosition(value, starts[0]).line - 1;
          var lastLine = firstLine + starts.length - 1;

          if ((step === -1 && firstLine === 0) || (step === 1 && lastLine === lines.length - 1)) {
            return selectionResult(value, from, to);
          }

          var block = lines.splice(firstLine, starts.length);
          var target = step === -1 ? firstLine - 1 : firstLine + 1;
          var neighbour = step === -1 ? lines[firstLine - 1] : lines[firstLine];
          var args = [target, 0].concat(block);
          lines.splice.apply(lines, args);
          var shift = (neighbour.length + 1) * step;
          return selectionResult(lines.join('\n'), from + shift, to + shift);
        }

        function diffSplice(before, after) {
          var a = str(before);
          var b = str(after);
          var max = Math.min(a.length, b.length);
          var prefix = 0;
          while (prefix < max && a.charCodeAt(prefix) === b.charCodeAt(prefix)) prefix += 1;
          var suffix = 0;
          while (
            suffix < max - prefix &&
            a.charCodeAt(a.length - 1 - suffix) === b.charCodeAt(b.length - 1 - suffix)

            suffix += 1;
          }
          return {
            start: prefix,
            end: a.length - suffix,
            insert: b.slice(prefix, b.length - suffix)
          };
        }

        /* ---------------------------------------------------------------- *
         * Notes
         * ---------------------------------------------------------------- */
        function createNote(options) {
          var opts = options || {};
          var now = typeof opts.now === 'number' ? opts.now : Date.now();
          var title = str(opts.title, '').trim();
          return {
            id: str(opts.id) || uid(),
            title: title === '' ? null : title,
            body: normalizeNewlines(str(opts.body)),
            createdAt: now,
            updatedAt: now,
            pinned: Boolean(opts.pinned)
          };

        function deriveTitle(body) {
          var lines = normalizeNewlines(str(body)).split('\n');
          for (var i = 0; i < lines.length; i += 1) {
            var line = lines[i].replace(/^\s*#{1,6}\s*/, '').replace(/\s+/g, ' ').trim();
            if (line !== '') {

        function displayTitle(note) {

          return explicit !== '' ? explicit : deriveTitle(note.body);

        function touchNote(note, patch, now) {

            id: note.id,
            title: note.title,
            body: note.body,
            createdAt: note.createdAt,
            updatedAt: note.updatedAt,
            pinned: note.pinned
          };
          if ('title' in changes) {
            var title = str(changes.title, '').trim();
            next.title = title === '' ? null : title;
          }
          if ('body' in changes) next.body = normalizeNewlines(str(changes.body));
          if ('pinned' in changes) next.pinned = Boolean(changes.pinned);
          var changed =
            next.title !== note.title || next.body !== note.body || next.pinned !== note.pinned;
          if (changed) next.updatedAt = typeof now === 'number' ? now : Date.now();

        }

        function sortNotes(notes, mode) {
          var how = SORT_MODES.indexOf(mode) === -1 ? 'updated' : mode;
          return (notes || []).slice().sort(function (a, b) {
            if (Boolean(a.pinned) !== Boolean(b.pinned)) return a.pinned ? -1 : 1;
            if (how === 'title') {
              return displayTitle(a).localeCompare(displayTitle(b), undefined, {
                sensitivity: 'base',
                numeric: true
              });
            }
            if (how === 'created') return b.createdAt - a.createdAt;
            return b.updatedAt - a.updatedAt;
          });
        }

        function filterNotes(notes, query) {
          var terms = String(query || '')
            .toLowerCase()
            .split(/\s+/)
            .filter(Boolean);
          if (terms.length === 0) return (notes || []).slice();
          return (notes || []).filter(function (note) {
            var haystack = (displayTitle(note) + '\n' + str(note.body)).toLowerCase();
            return terms.every(function (term) {
              return haystack.indexOf(term) !== -1;
            });
          });
        }

        function makeSnippet(body, query, max) {
          var limit = typeof max === 'number' ? max : 100;
          var source = normalizeNewlines(str(body));
          var first = String(query || '').trim().split(/\s+/)[0];
          // With nothing to search for, only the start of the note can show, so
          // do not flatten megabytes of text to throw it away.
          if (!first) source = source.slice(0, limit * 6 + 200);
          var flat = source.replace(/\s+/g, ' ').trim();
          if (flat === '') return '';
          var start = 0;
          if (first) {
            var at = flat.toLowerCase().indexOf(first.toLowerCase());
            if (at > 0) start = Math.max(0, at - 20);
          }
          var slice = flat.slice(start, start + limit);
          return (start > 0 ? '…' : '') + slice + (start + limit < flat.length ? '…' : '');
        }

        function copyName(title, existing) {

            var top = document.createElement('span');
            top.className = 'note-item__top';

            if (note.pinned) {
              var pin = document.createElement('span');
              pin.className = 'note-item__pin';
              pin.setAttribute('aria-hidden', 'true');
              pin.textContent = '★';
              top.appendChild(pin);

              var pinLabel = document.createElement('span');
              pinLabel.className = 'sr-only';
              pinLabel.textContent = 'Pinned. ';
              top.appendChild(pinLabel);
            }

            var title = document.createElement('span');
            title.className = 'note-item__title';
            title.textContent = core.displayTitle(note);
            top.appendChild(title);

            var time = document.createElement('span');
            time.className = 'note-item__time';
            time.textContent = core.formatRelativeTime(note.updatedAt, now);
            top.appendChild(time);

            var snippet = document.createElement('span');
            snippet.className = 'note-item__snippet';
            snippet.textContent = core.makeSnippet(note.body, search, 90);

            item.appendChild(top);
            item.appendChild(snippet);

            var li = document.createElement('li');
            li.appendChild(item);
            list.appendChild(li);
          });

          el.noteList.textContent = '';
          el.noteList.appendChild(list);
          el.noteListEmpty.hidden = ordered.length > 0;

          var total = state.notes.length;
          el.noteCount.textContent =
            ordered.length === total
              ? core.pluralize(total, 'note')
              : ordered.length + ' of ' + core.pluralize(total, 'note');
        }

        function renderToolbar() {
          var note = activeNote();
          if (document.activeElement !== el.noteTitle) {
            el.noteTitle.value = note.title === null ? core.deriveTitle(note.body) : note.title;
          }
          el.pinNote.setAttribute('aria-pressed', note.pinned ? 'true' : 'false');
          el.pinNote.setAttribute('aria-label', note.pinned ? 'Unpin note' : 'Pin note');
          el.pinNote.title = note.pinned ? 'Unpin note' : 'Pin note';
        }

        function renderEditor() {
          var note = activeNote();
          if (el.editor.value !== note.body) el.editor.value = note.body;
        }

        function renderStatus() {
          var text = el.editor.value;
          var at = core.caretPosition(text, el.editor.selectionStart);
          var stats = core.countStats(text);
          el.statusPosition.textContent = 'Ln ' + at.line + ', Col ' + at.column;

          var from = el.editor.selectionStart;
          var to = el.editor.selectionEnd;
          if (to > from) {
            var selected = text.slice(from, to);
            var lines = selected.split('\n').length;
            el.statusSelection.textContent =
              core.formatNumber(selected.length) +
              ' selected' +
              (lines > 1 ? ' · ' + core.pluralize(lines, 'line') : '');
          } else {
            el.statusSelection.textContent = '';
          }

          el.statusStats.textContent =
            core.pluralize(stats.words, 'word') +
            ' · ' +
            core.pluralize(stats.characters, 'character') +
            ' · ' +
            core.pluralize(stats.lines, 'line');
          el.statusUpdated.textContent =
            'Edited ' + core.formatRelativeTime(activeNote().updatedAt, Date.now());
        }

        function render() {
          applySettings();
          renderList();
          renderToolbar();
          renderEditor();
          renderStatus();
        }

        /* ================================================================ *
         * Editing
         * ================================================================ */
        function handleEditorInput() {
          patchActive({ body: el.editor.value });
          markDirty();
          renderList();
          renderToolbar();
          renderStatus();
          if (find.open) refreshFind({ keepIndex: true });
        }

        /**
         * Apply a pure editor transform. The change is pushed through the
         * smallest possible splice so the browser's native undo stack survives;
         * direct assignment is the fallback when execCommand is unavailable.
         */
        function applyEdit(result) {
          var before = el.editor.value;
          if (result.text !== before) {
            var splice = core.diffSplice(before, result.text);
            var applied = false;
            if (typeof document.execCommand === 'function') {
              try {
                el.editor.focus();
                el.editor.setSelectionRange(splice.start, splice.end);
                applied = splice.insert === ''
                  ? document.execCommand('delete', false, null)
                  : document.execCommand('insertText', false, splice.insert);
              } catch (error) {
                applied = false;
              }
            }
            if (!applied || el.editor.value !== result.text) el.editor.value = result.text;
          }
          el.editor.setSelectionRange(result.selectionStart, result.selectionEnd);
          handleEditorInput();
        }

        function editSelection(transform) {
          applyEdit(transform(el.editor.value, el.editor.selectionStart, el.editor.selectionEnd));
        }

        function insertAtCaret(text) {
          var spliced = core.replaceRange(
            el.editor.value,
            el.editor.selectionStart,
            el.editor.selectionEnd,
            text
          );
          applyEdit({
            text: spliced.text,
            selectionStart: spliced.caret,
            selectionEnd: spliced.caret
          });
        }

        function focusEditor() {
          el.editor.focus();
        }

        function revealSelection() {
          if (typeof el.editor.scrollIntoView === 'function') {
            try {
              el.editor.scrollIntoView({ block: 'nearest' });
            } catch (error) {
              /* older browsers ignore the options object */
            }
          }
        }

        /* ================================================================ *
         * Notes
         * ================================================================ */
        /** True on phone-sized screens, where the sidebar is a drawer. */
        function isNarrow() {
          return (
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(max-width: 720px)').matches
          );
        }

        function activate(id, options) {
          var opts = options || {};
          state.activeId = id;
          // On a phone the drawer covers the editor, so get out of the way.
          if (isNarrow() && settings().sidebarOpen) settings().sidebarOpen = false;
          render();
          if (opts.focus !== false) {
            focusEditor();
            el.editor.setSelectionRange(0, 0);
          }
          if (find.open) refreshFind({});
          markDirty();
        }

        function createNote(options) {
          var note = core.createNote(
            Object.assign({ now: Date.now() }, options || {})
          );
          state.notes.unshift(note);
          return note;
        }

        /* ================================================================ *
         * Find & replace
         * ================================================================ */
        function findOptions() {
          return {
            caseSensitive: find.caseSensitive,
            wholeWord: find.wholeWord,
            useRegex: find.useRegex
          };
        }

        function openFind() {
          var selected = el.editor.value.slice(el.editor.selectionStart, el.editor.selectionEnd);
          if (selected && selected.indexOf('\n') === -1) el.findInput.value = selected;
          find.open = true;
          el.findbar.hidden = false;
          el.findInput.focus();
          el.findInput.select();
          refreshFind({});
        }

        function closeFind() {
          find.open = false;
          el.findbar.hidden = true;
          focusEditor();
        }

        /**
         * Recount the matches in the active note.
         *
         * @param {object} options
         * @param {number} [options.from]     search onwards from this offset
         * @param {number} [options.direction] 1 forwards (default) or -1 back
         * @param {boolean} [options.keepIndex] only refresh the readout; never
         *        move the caret. Used while the note is being typed into.
         */
        function refreshFind(options) {
          var opts = options || {};
          var query = el.findInput.value;
          find.error = null;
          el.findInput.removeAttribute('aria-invalid');

          if (query === '') {
            find.matches = [];
            find.index = -1;
            el.findCount.textContent = '';
            return;
          }

          try {
            find.matches = core.findMatches(el.editor.value, query, findOptions());
          } catch (error) {
            find.matches = [];
            find.index = -1;
            find.error = error.message;
            el.findInput.setAttribute('aria-invalid', 'true');
            el.findCount.textContent = 'Invalid pattern';
            return;
          }

          if (find.matches.length === 0) {
            find.index = -1;
            el.findCount.textContent = 'No results';
            return;
          }

          if (opts.keepIndex) {
            find.index = core.clamp(find.index, 0, find.matches.length - 1);
            renderFindCount();
            return;
          }

          var from = typeof opts.from === 'number' ? opts.from : el.editor.selectionStart;
          find.index = core.findNextIndex(find.matches, from, {
            direction: opts.direction === -1 ? -1 : 1
          });
          if (find.index < 0) find.index = 0;
          selectCurrentMatch();
          renderFindCount();
        }

        function renderFindCount() {
          if (find.matches.length === 0) return;
          el.findCount.textContent = find.index + 1 + ' of ' + find.matches.length;
        }

        function selectCurrentMatch() {
          var match = find.matches[find.index];
          if (!match) return;
          el.editor.setSelectionRange(match.start, match.end);
          revealSelection();
          renderStatus();
        }

        function stepFind(direction) {
          if (find.matches.length === 0) {
            refreshFind({ direction: direction });
            return;
          }
          var current = find.matches[find.index];
          var from = current
            ? direction === -1
              ? current.start
              : current.end
            : el.editor.selectionStart;
          find.index = core.findNextIndex(find.matches, from, { direction: direction });
          if (find.index < 0) find.index = 0;
          selectCurrentMatch();
          renderFindCount();
        }

        function replaceCurrent() {
          if (!find.open || find.matches.length === 0) return;
          var match = find.matches[find.index];
          if (!match) return;
          var spliced = core.replaceRange(
            el.editor.value,
            match.start,
            match.end,
            el.replaceInput.value
          );
          applyEdit({
            text: spliced.text,
            selectionStart: spliced.caret,
            selectionEnd: spliced.caret
          });
          refreshFind({ from: spliced.caret });
        }

        function replaceEverything() {
          var query = el.findInput.value;
          if (query === '') return;
          var result;
          try {
            result = core.replaceAll(
              el.editor.value,
              query,
              el.replaceInput.value,
              findOptions()
            );
          } catch (error) {
            el.findCount.textContent = 'Invalid pattern';
            return;
          }
          if (result.count === 0) {
            toast('Nothing to replace.');
            return;
          }
          var caret = Math.min(el.editor.selectionStart, result.text.length);
          applyEdit({ text: result.text, selectionStart: caret, selectionEnd: caret });
          refreshFind({});
          toast('Replaced ' + core.pluralize(result.count, 'match', 'matches') + '.');
        }

        /* ================================================================ *
         * Dialogs
         * ================================================================ */
        function focusables(container) {
          return Array.prototype.filter.call(
            container.querySelectorAll('button, input, select, textarea, [href]'),
            function (node) {
              return !node.disabled && !node.hidden;
            }
          );
        }

        function openDialog(id, options) {
          var opts = options || {};
          closeDialog();
          dialog.id = id;
          dialog.returnFocus = opts.returnFocus || document.activeElement;
          dialog.onConfirm = opts.onConfirm || null;
          el.backdrop.hidden = false;
          var node = document.getElementById(id);
          node.hidden = false;
          node.scrollTop = 0; // a long dialog must open at its beginning
          var target = opts.focus || focusables(node)[0];
          if (target) target.focus();
        }

        function closeDialog() {
          if (dialog.id) {
            var node = document.getElementById(dialog.id);
            if (node) node.hidden = true;
          }
          el.backdrop.hidden = true;
          var returnTo = dialog.returnFocus;
          dialog.id = null;
          dialog.returnFocus = null;
          dialog.onConfirm = null;
          if (returnTo && typeof returnTo.focus === 'function') returnTo.focus();
        }

        function confirmAction(options) {
          el.confirmTitle.textContent = options.title;
          el.confirmText.textContent = options.text;
          el.confirmOk.textContent = options.confirmLabel || 'Delete';
          openDialog('confirm-dialog', {
            onConfirm: options.onConfirm,
            focus: el.confirmOk
          });
        }

        function openGoto() {
          var lines = core.countStats(el.editor.value).lines;
          el.gotoHelp.textContent = 'This note has ' + core.pluralize(lines, 'line') +
            '. Enter a number between 1 and ' + lines + '.';
          el.gotoInput.max = String(lines);
          el.gotoInput.value = String(core.caretPosition(el.editor.value, el.editor.selectionStart).line);
          openDialog('goto-dialog', { returnFocus: el.editor, focus: el.gotoInput });
          el.gotoInput.select();
        }

        function confirmGoto() {
          var requested = parseInt(el.gotoInput.value, 10);
          if (!isFinite(requested)) {
            closeDialog();
            return;
          }
          var range = core.lineRange(el.editor.value, requested);
          closeDialog();
          focusEditor();
          el.editor.setSelectionRange(range.start, range.start);
          revealSelection();
          renderStatus();
        }

        function buildHelp() {
          var groups = [];
          core.SHORTCUTS.forEach(function (binding) {
            var group = groups.filter(function (g) {
              return g.name === binding.group;
            })[0];
            if (!group) {
              group = { name: binding.group, items: [] };
              groups.push(group);
            }
            group.items.push(binding);
          });

          el.helpVersion.textContent = 'Notepad ' + APP_VERSION;
          el.helpBody.textContent = '';
          groups.forEach(function (group) {
            var heading = document.createElement('h3');
            heading.textContent = group.name;
            el.helpBody.appendChild(heading);

            var grid = document.createElement('dl');
            grid.className = 'shortcut-grid';
            group.items.forEach(function (binding) {
              var term = document.createElement('dt');
              term.textContent = binding.label;
              var value = document.createElement('dd');
              var kbd = document.createElement('kbd');
              kbd.textContent = core.shortcutHint(binding.id, platform);
              value.appendChild(kbd);
              grid.appendChild(term);
              grid.appendChild(value);
            });
            el.helpBody.appendChild(grid);
          });
        }

        /* ================================================================ *
         * Files
         * ================================================================ */
        function download(filename, text, mime) {
          lastExport = { filename: filename, text: text, mime: mime };
          try {
            var url;
            if (window.URL && typeof window.URL.createObjectURL === 'function') {
              url = window.URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
            } else {
              url = 'data:' + mime + ';charset=utf-8,' + encodeURIComponent(text);
            }
            var anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = filename;
            anchor.rel = 'noopener';
            anchor.style.display = 'none';
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            if (url.slice(0, 5) === 'blob:' && window.URL.revokeObjectURL) {
              window.setTimeout(function () {
                window.URL.revokeObjectURL(url);
              }, 10000);
            }
            toast('Saved ' + filename);
          } catch (error) {
            toast('This browser would not start the download.');
          }
        }

        function readText(file) {
          return new Promise(function (resolve, reject) {
            if (typeof file.text === 'function') {
              file.text().then(resolve, reject);
              return;
            }
            var reader = new FileReader();
            reader.onload = function () {
              resolve(String(reader.result));
            };
            reader.onerror = function () {
              reject(reader.error || new Error('The file could not be read.'));
            };
            reader.readAsText(file);
          });
        }

        function openFiles(files) {
          var list = Array.prototype.slice.call(files || []);
          if (list.length === 0) return Promise.resolve();
          return Promise.all(
            list.map(function (file) {
              return readText(file).then(
                function (text) {
                  return { name: file.name, text: text };
                },
                function () {
                  return null;
                }
              );
            })
          ).then(function (results) {
            var opened = 0;
            var lastId = null;
            results.forEach(function (result) {
              if (!result) return;
              var note = createNote({
                title: String(result.name).replace(/\.[^.]+$/, ''),
                body: result.text
              });
              lastId = note.id;
              opened += 1;
            });
            if (opened === 0) {
              toast('Could not read that file.');
              return;
            }
            activate(lastId, {});
            flush();
            toast('Opened ' + core.pluralize(opened, 'file') + '.');
          });
        }

        function importFiles(files) {
          var file = (files || [])[0];
          if (!file) return Promise.resolve();
          return readText(file).then(
            function (text) {
              var notes;
              try {
                notes = core.importBundle(text, Date.now());
              } catch (error) {
                toast(error.message);
                return;
              }
              notes.forEach(function (note) {
                state.notes.unshift(note);
              });
              activate(notes[0].id, {});
              flush();
              toast('Imported ' + core.pluralize(notes.length, 'note') + '.');
            },
            function () {
              toast('Could not read that file.');
            }
          );
        }

        /* ================================================================ *
         * Commands
         * ================================================================ */
        var commands = {
          'note.new': function () {
            var note = createNote({});
            activate(note.id, {});
            toast('New note');
          },
          'note.duplicate': function () {
            var source = activeNote();
            var taken = state.notes.map(core.displayTitle);
            var copy = createNote({
              title: core.copyName(core.displayTitle(source), taken),
              body: source.body,
              pinned: source.pinned
            });
            activate(copy.id, {});
            toast('Duplicated note');
          },
          'note.delete': function () {
            var note = activeNote();
            confirmAction({
              title: 'Delete this note?',
              text: '“' + core.displayTitle(note) + '” will be removed from this browser. This cannot be undone.',
              onConfirm: function () {
                var ordered = orderedNotes();
                var nextId = core.nextActiveId(ordered, note.id);
                state.notes = state.notes.filter(function (candidate) {
                  return candidate.id !== note.id;
                });
                if (nextId === null) {
                  var fresh = core.createNote({ now: Date.now() });
                  state.notes.push(fresh);
                  nextId = fresh.id;
                }
                activate(nextId, {});
                flush();
                toast('Note deleted');
              }
            });
          },
          'note.togglePin': function () {
            patchActive({ pinned: !activeNote().pinned });
            render();
            markDirty();
          },
          'note.next': function () {
            step(1);
          },
          'note.previous': function () {
            step(-1);
          },
          'file.open': function () {
            el.fileInput.value = '';
            el.fileInput.click();
          },
          'file.save': function () {
            var note = activeNote();
            download(core.exportFilename(core.displayTitle(note), 'txt'), note.body, 'text/plain');
          },
          'file.saveAs': function () {
            var note = activeNote();
            var stamp = core.formatTimestamp(Date.now()).replace(/[: ]/g, '-');
            download(
              core.exportFilename(core.displayTitle(note) + ' ' + stamp, 'txt'),
              note.body,
              'text/plain'
            );
          },
          'file.exportAll': function () {
            download(
              core.exportFilename('notepad backup ' + core.formatTimestamp(Date.now()), 'json'),
              JSON.stringify(core.exportBundle(state, Date.now()), null, 2),
              'application/json'
            );
          },
          'file.import': function () {
            el.importInput.value = '';
            el.importInput.click();
          },
          'file.print': function () {
            var note = activeNote();
            el.printTitle.textContent = core.displayTitle(note);
            el.printBody.textContent = note.body;
            try {
              window.print();
            } catch (error) {
              toast('This browser would not open the print dialog.');
            }
          },
          'find.open': openFind,
          'find.replace': openFind,
          'find.next': function () {
            if (!find.open) openFind();
            else stepFind(1);
          },
          'find.previous': function () {
            if (!find.open) openFind();
            else stepFind(-1);
          },
          'editor.gotoLine': openGoto,
          'editor.insertDateTime': function () {
            insertAtCaret(core.formatTimestamp(Date.now()));
          },
          'editor.indent': function () {
            editSelection(function (text, from, to) {
              return core.indentLines(text, from, to);
            });
          },
          'editor.outdent': function () {
            editSelection(function (text, from, to) {
              return core.outdentLines(text, from, to);
            });
          },
          'editor.duplicateLine': function () {
            editSelection(core.duplicateLines);
          },
          'editor.deleteLine': function () {
            editSelection(core.deleteLines);
          },
          'editor.moveLineUp': function () {
            editSelection(function (text, from, to) {
              return core.moveLines(text, from, to, -1);
            });
          },
          'editor.moveLineDown': function () {
            editSelection(function (text, from, to) {
              return core.moveLines(text, from, to, 1);
            });
          },
          'view.toggleSidebar': function () {
            settings().sidebarOpen = !settings().sidebarOpen;
            applySettings();
            markDirty();
          },
          'view.toggleWordWrap': function () {
            settings().wordWrap = !settings().wordWrap;
            applySettings();
            markDirty();
            toast(settings().wordWrap ? 'Word wrap on' : 'Word wrap off');
          },
          'view.toggleSpellcheck': function () {
            settings().spellcheck = !settings().spellcheck;
            applySettings();
            markDirty();
          },
          'view.cycleTheme': function () {
            var next = (core.THEMES.indexOf(settings().theme) + 1) % core.THEMES.length;
            settings().theme = core.THEMES[next];
            applySettings();
            markDirty();
            toast('Theme: ' + THEME_LABELS[settings().theme]);
          },
          'view.cycleFont': function () {
            var next =
              (core.FONT_FAMILIES.indexOf(settings().fontFamily) + 1) % core.FONT_FAMILIES.length;
            settings().fontFamily = core.FONT_FAMILIES[next];
            applySettings();
            markDirty();
          },
          'view.fontLarger': function () {
            setFontSize(settings().fontSize + core.FONT_SIZE_RANGE.step);
          },
          'view.fontSmaller': function () {
            setFontSize(settings().fontSize - core.FONT_SIZE_RANGE.step);
          },
          'view.fontReset': function () {
            setFontSize(core.FONT_SIZE_RANGE.default);
          },
          'view.help': function () {
            // Focus the panel itself, not the Close button at the bottom, so the
            // sheet opens at the top where the shortcuts start.
            openDialog('help-dialog', { focus: el.helpDialog });
          }
        };

        function setFontSize(size) {
          settings().fontSize = core.clamp(
            size,
            core.FONT_SIZE_RANGE.min,
            core.FONT_SIZE_RANGE.max
          );
          applySettings();
          markDirty();
        }

        function step(direction) {
          var ordered = visibleNotes();
          if (ordered.length < 2) return;
          var index = 0;
          for (var i = 0; i < ordered.length; i += 1) {
            if (ordered[i].id === state.activeId) index = i;
          }
          var next = (index + direction + ordered.length) % ordered.length;
          activate(ordered[next].id, {});
        }

        function run(command) {
          var handler = commands[command];
          if (!handler) return false;
          handler();
          return true;
        }

        /* ================================================================ *
         * Menu
         * ================================================================ */
        var MENU = [
          { command: 'file.open', label: 'Open text file…' },
          { command: 'file.save', label: 'Save as text file' },
          { command: 'file.saveAs', label: 'Save a dated copy' },
          { command: 'file.print', label: 'Print…' },
          { separator: true },
          { command: 'editor.insertDateTime', label: 'Insert date & time' },
          { command: 'editor.gotoLine', label: 'Go to line…' },

          {

            }
          },

          {
