            }
          },
          { separator: true },
          { command: 'file.exportAll', label: 'Export all notes…' },
          { command: 'file.import', label: 'Import notes…' },
          { separator: true },
          { command: 'view.help', label: 'Keyboard shortcuts' },
          { separator: true },
          { command: 'note.delete', label: 'Delete note', danger: true }
        ];

        function buildMenu() {
          el.menu.textContent = '';
          MENU.forEach(function (entry) {
            if (entry.separator) {
              var sep = document.createElement('div');
              sep.className = 'menu__sep';
              sep.setAttribute('role', 'separator');
              el.menu.appendChild(sep);
              return;
            }
            var item = document.createElement('button');
            item.type = 'button';
            item.className = 'menu__item' + (entry.danger ? ' menu__item--danger' : '');
            item.setAttribute('role', 'menuitem');
            item.dataset.command = entry.command;

            var check = document.createElement('span');
            check.className = 'menu__check';
            check.setAttribute('aria-hidden', 'true');
            check.textContent = '✓';

            var label = document.createElement('span');
            label.className = 'menu__label';
            label.textContent = entry.label;

            var value = document.createElement('span');
            value.className = 'menu__value';

            var hint = document.createElement('span');
            hint.className = 'menu__hint';
            hint.textContent = core.shortcutHint(entry.command, platform);

            item.appendChild(check);
            item.appendChild(label);
            item.appendChild(value);
            item.appendChild(hint);
            el.menu.appendChild(item);
          });
        }

        function syncMenu() {
          MENU.forEach(function (entry) {
            if (entry.separator) return;
            var item = el.menu.querySelector('[data-command="' + entry.command + '"]');
            if (!item) return;
            if (entry.checked) item.setAttribute('aria-checked', entry.checked() ? 'true' : 'false');
            if (entry.value) item.querySelector('.menu__value').textContent = entry.value();
          });
        }

        function menuItems() {
          return Array.prototype.slice.call(el.menu.querySelectorAll('[role="menuitem"]'));
        }

        function openMenu() {
          syncMenu();
          el.menu.hidden = false;
          el.menuButton.setAttribute('aria-expanded', 'true');
        }

        function closeMenu(options) {
          if (el.menu.hidden) return;
          el.menu.hidden = true;
          el.menuButton.setAttribute('aria-expanded', 'false');
          if (options && options.focusButton) el.menuButton.focus();
        }

        function toggleMenu() {
          if (el.menu.hidden) openMenu();
          else closeMenu({});
        }

        function moveMenuFocus(direction) {
          var items = menuItems();
          if (items.length === 0) return;
          var current = items.indexOf(document.activeElement);
          var next = current === -1
            ? direction > 0 ? 0 : items.length - 1
            : (current + direction + items.length) % items.length;
          items[next].focus();
        }

        /* ================================================================ *
         * Events
         * ================================================================ */
        // --- sidebar
        el.newNote.addEventListener('click', function () {
          run('note.new');
        });

        el.search.addEventListener('input', function () {
          search = el.search.value;
          renderList();
        });

        el.sortMode.addEventListener('change', function () {
          settings().sortMode = el.sortMode.value;
          renderList();
          markDirty();
        });

        el.noteList.addEventListener('click', function (event) {
          var item = event.target.closest ? event.target.closest('.note-item') : null;
          if (!item) return;
          activate(item.dataset.id, {});
        });

        el.noteList.addEventListener('keydown', function (event) {
          if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
          var items = Array.prototype.slice.call(el.noteList.querySelectorAll('.note-item'));
          var current = items.indexOf(document.activeElement);
          if (current === -1) return;
          event.preventDefault();
          var next = current + (event.key === 'ArrowDown' ? 1 : -1);
          if (next >= 0 && next < items.length) items[next].focus();
        });

        el.scrim.addEventListener('click', function () {
          if (settings().sidebarOpen) run('view.toggleSidebar');
        });

        el.exportAll.addEventListener('click', function () {
          run('file.exportAll');
        });

        el.importNotes.addEventListener('click', function () {
          run('file.import');
        });

        // --- toolbar
        el.toggleSidebar.addEventListener('click', function () {
          run('view.toggleSidebar');
        });

        el.noteTitle.addEventListener('input', function () {
          patchActive({ title: el.noteTitle.value });
          markDirty();
          renderList();
        });

        el.noteTitle.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            focusEditor();
          }
        });

        el.noteTitle.addEventListener('blur', renderToolbar);

        el.pinNote.addEventListener('click', function () {
          run('note.togglePin');
        });

        el.findOpen.addEventListener('click', function () {
          run('find.open');
        });

        el.saveFile.addEventListener('click', function () {
          run('file.save');
        });

        el.menuButton.addEventListener('click', function (event) {
          event.stopPropagation();
          toggleMenu();
        });

        el.menuButton.addEventListener('keydown', function (event) {
          if (event.key === 'ArrowDown') {
            event.preventDefault();
            if (el.menu.hidden) openMenu();
            moveMenuFocus(1);
          }
        });

        el.menu.addEventListener('click', function (event) {
          var item = event.target.closest ? event.target.closest('[data-command]') : null;
          if (!item) return;
          closeMenu({});
          run(item.dataset.command);
        });

        el.menu.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') {
            event.preventDefault();
            closeMenu({ focusButton: true });
          } else if (event.key === 'ArrowDown') {
            event.preventDefault();
            moveMenuFocus(1);
          } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            moveMenuFocus(-1);
          } else if (event.key === 'Tab') {
            closeMenu({});
          }
        });

        document.addEventListener('click', function (event) {
          if (!el.menu.hidden && !el.menu.contains(event.target) && event.target !== el.menuButton) {
            closeMenu({});
          }
        });

        // --- find bar
        el.findInput.addEventListener('input', function () {
          refreshFind({});
        });

        el.findInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            stepFind(event.shiftKey ? -1 : 1);
          } else if (event.key === 'Escape') {
            event.preventDefault();
            closeFind();
          }
        });

        el.replaceInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            replaceCurrent();
          } else if (event.key === 'Escape') {
            event.preventDefault();
            closeFind();
          }
        });

        el.findNext.addEventListener('click', function () {
          stepFind(1);
        });

        el.findPrev.addEventListener('click', function () {
          stepFind(-1);
        });

        el.replaceOne.addEventListener('click', replaceCurrent);
        el.replaceAll.addEventListener('click', replaceEverything);
        el.findClose.addEventListener('click', closeFind);

        [
          { node: el.optCase, flag: 'caseSensitive' },
          { node: el.optWord, flag: 'wholeWord' },
          { node: el.optRegex, flag: 'useRegex' }
        ].forEach(function (toggle) {
          toggle.node.addEventListener('click', function () {
            find[toggle.flag] = !find[toggle.flag];
            toggle.node.setAttribute('aria-pressed', find[toggle.flag] ? 'true' : 'false');
            refreshFind({ from: 0 });
          });
        });

        // --- editor
        el.editor.addEventListener('input', handleEditorInput);
        ['keyup', 'click', 'select', 'focus'].forEach(function (type) {
          el.editor.addEventListener(type, renderStatus);
        });

        el.editorWrap.addEventListener('dragover', function (event) {
          if (!event.dataTransfer) return;
          event.preventDefault();
          el.editorWrap.classList.add('is-dropping');
        });

        ['dragleave', 'dragend'].forEach(function (type) {
          el.editorWrap.addEventListener(type, function () {
            el.editorWrap.classList.remove('is-dropping');
          });
        });

        el.editorWrap.addEventListener('drop', function (event) {
          if (!event.dataTransfer) return;
          event.preventDefault();
          el.editorWrap.classList.remove('is-dropping');
          openFiles(event.dataTransfer.files);
        });

        // --- status bar
        el.fontLarger.addEventListener('click', function () {
          run('view.fontLarger');
        });

        el.fontSmaller.addEventListener('click', function () {
          run('view.fontSmaller');
        });

        // --- dialogs
        el.gotoConfirm.addEventListener('click', confirmGoto);
        el.gotoCancel.addEventListener('click', closeDialog);
        el.gotoInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            confirmGoto();
          }
        });

        el.confirmCancel.addEventListener('click', closeDialog);
        el.confirmOk.addEventListener('click', function () {
          var action = dialog.onConfirm;
          closeDialog();
          if (action) action();
        });

        el.helpClose.addEventListener('click', closeDialog);
        el.backdrop.addEventListener('click', closeDialog);

        document.addEventListener('keydown', function (event) {
          // A modal owns the keyboard: close on Escape, keep Tab inside it, and
          // let every other key fall through to the field the user is in.
          if (dialog.id) {
            if (event.key === 'Escape') {
              event.preventDefault();
              closeDialog();
            } else if (event.key === 'Tab') {
              var items = focusables(document.getElementById(dialog.id));
              if (items.length > 0) {
                var first = items[0];
                var last = items[items.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                  event.preventDefault();
                  last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                  event.preventDefault();
                  first.focus();
                }
              }
            }
            return;
          }

          if (event.key === 'Escape' && !el.menu.hidden) {
            closeMenu({ focusButton: true });
            return;
          }

          if (event.key === 'Escape' && find.open) {
            closeFind();
            return;
          }

          var scope = event.target === el.editor ? 'editor' : 'app';
          var command = core.resolveShortcut(event, { platform: platform, scope: scope });
          if (!command) return;

          if (command === 'editor.newline') {
            var result = core.pressEnter(
              el.editor.value,
              el.editor.selectionStart,
              el.editor.selectionEnd
            );
            var plain = core.replaceRange(
              el.editor.value,
              el.editor.selectionStart,
              el.editor.selectionEnd,
              '\n'
            );
            // Nothing clever to add: let the browser handle the keystroke so its
            // own undo history stays intact.
            if (result.text === plain.text) return;
            event.preventDefault();
            applyEdit(result);
            return;
          }

          if (!commands[command]) return;
          event.preventDefault();
          run(command);
        });

        // --- files
        el.fileInput.addEventListener('change', function () {
          openFiles(el.fileInput.files);
        });

        el.importInput.addEventListener('change', function () {
          importFiles(el.importInput.files);
        });

        // --- lifecycle
        el.storageBannerDismiss.addEventListener('click', function () {
          el.storageBanner.hidden = true;
        });

        window.addEventListener('beforeunload', function () {
          if (dirty) flush();
        });

        // Another tab of the same notepad saved. Fold its work into ours rather
        // than overwriting it on our next save, and keep whatever is being
        // typed here — the editor holds the freshest version of the open note.
        window.addEventListener('storage', function (event) {
          if (event.key !== core.STORAGE_KEY || !event.newValue) return;
          var incoming = core.deserialize(event.newValue, Date.now());
          var typing = el.editor.value;
          state = core.mergeStates(state, incoming);
          if (activeNote() && activeNote().body !== typing && dirty) {
            patchActive({ body: typing });
          }
          render();
        });

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden' && dirty) flush();
        });

        // "3 min ago" should not sit there lying for an hour.
        window.setInterval(function () {
          if (!el.noteList.contains(document.activeElement)) renderList();
          el.statusUpdated.textContent =
            'Edited ' + core.formatRelativeTime(activeNote().updatedAt, Date.now());
        }, 60000);

        if (window.matchMedia) {
          var scheme = window.matchMedia('(prefers-color-scheme: dark)');
          if (scheme && scheme.addEventListener) {
            scheme.addEventListener('change', function () {
              if (settings().theme === 'system') applySettings();
            });
          }
        }

        /* ================================================================ *
         * Boot
         * ================================================================ */
        // A deliberate, documented seam: the integration tests and anyone
        // poking at the page in a console drive the app through this.
        window.__notepad = {
          core: core,
          storageKind: store.kind,
          getState: function () {
            return state;
          },
          get lastExport() {
            return lastExport;
          },
          run: run,
          flush: flush
        };

        buildMenu();
        buildHelp();
        // A phone opens straight into the note, not into the drawer.
        if (isNarrow()) settings().sidebarOpen = false;
        // Seed the textarea before the first render so the caret starts at the
        // top of the note rather than wherever assigning `value` leaves it.
        el.editor.value = activeNote().body;
        el.editor.setSelectionRange(0, 0);
        render();
        flush();

        if (store.kind === 'memory') {
          showBanner(
            'This page cannot use browser storage, so notes live only until you close the tab. Serve the file over http:// (see the README) or export a backup before you leave.'
          );
        }

        focusEditor();
      })(NotepadCore);
    </script>
  </body>
</html>
